const gold = new THREE.Color(1, .78, .18), red = new THREE.Color(1, .14, .14), tmpC = new THREE.Color();
function apply(st, T) {
  // gökyüzü / ışık
  if (st.gold) { skyU.uTop.value.set(0x35609a); skyU.uHor.value.set(0xf6c27c); skyU.uSunC.value.set(0xffc27a); sun.color.set(0xffd09a); skyU.uSun.value.set(-.6, .12, -.8).normalize(); }

  { const o = branch.userData.olives[3]; const base0 = o.userData.p0 || (o.userData.p0 = o.position.clone()); const k = st.pick || 0;

  if (st.only === 0) { cuts[0].position.copy(P_CUT); } else { cuts[0].position.copy(P_CUT).add(V(-2.6, 0, 0)); } cutPlanes();

    p.y = Math.min(p.y, P_JAR.y + 10.8); dummy.position.copy(p); dummy.scale.setScalar(st.leak > 0 && i < 400 * st.leak ? 1 - st.chg : 0); dummy.updateMatrix(); LEAK.setMatrixAt(i, dummy.matrix); }

function ctaAnim(lt, d) {

function captions(T) {

}
