  storm: { top: 0x3a4652, hor: 0x8b98a4, deep: 0x1d3a48, sunc: 0xc9d4dc, sun: V(-.3, .5, .2), amp: 3.4, exp: 1.0, fog: 0x8a96a1 },
};

// ---------- gökyüzü ----------
const skyU = { uTop: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uSun: { value: V(0, 1, 0) }, uSunC: { value: new THREE.Color() } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(8000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: `varying vec3 vD; void main(){ vD = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }`,

   gl_FragColor = vec4(c,1.); }`

// ---------- deniz yüzeyi (Gerstner) ----------
const clipFront = new THREE.Plane(V(0, 0, -1), 0);   // z < zg tutulur (kesit görünüm)
const seaU = {
  uT: { value: 0 }, uAmp: { value: 1 }, uDeep: { value: new THREE.Color() }, uHor: { value: new THREE.Color() }, uTop: { value: new THREE.Color() },
  uSun: { value: V(0, 1, 0) }, uSunC: { value: new THREE.Color() }, uFogC: { value: new THREE.Color() }, uFogD: { value: .0004 }, uA: { value: 1 }, uUnder: { value: new THREE.Color(0x6fd6f2) },

uniform float uT,uAmp;
vec3 gerst(vec2 p, out vec3 N){
  vec3 o = vec3(p.x,0.,p.y); vec3 n = vec3(0.,1.,0.);
  ${WAVES.map(([dx, dz, L, a]) => `{ vec2 d=normalize(vec2(${dx.toFixed(2)},${dz.toFixed(2)})); float k=6.2832/${L.toFixed(1)}; float A=${a.toFixed(2)}*uAmp;

  uniforms: seaU, side: THREE.DoubleSide, clipping: true, clippingPlanes: [], transparent: true,

    w.xyz = vec3(g.x, g.y, g.z); vW = w.xyz; vN = N; vH = g.y/(max(uAmp,.1)*2.);

  fragmentShader: `uniform vec3 uDeep,uHor,uTop,uSun,uSunC,uFogC,uUnder; uniform float uFogD,uA;

// CPU tarafı dalga yüksekliği (tekne sallanması)
function waveY(x, z, t, amp) {
  let y = 0; for (const [dx, dz, L, a] of WAVES) { const l = Math.hypot(dx, dz), k = 6.2832 / L; y += a * amp * Math.sin(k * ((dx * x + dz * z) / l - Math.sqrt(9.8 / k) * t)); } return y;

// ---------- deniz tabanı ----------
const BED_Y = -72;
const bedU = { uT: { value: 0 }, uFogC: { value: new THREE.Color() }, uFogD: { value: .01 } };

{ const p = bedGeo.attributes.position; for (let i = 0; i < p.count; i++) { const x = p.getX(i), z = p.getZ(i);
  p.setY(i, BED_Y + Math.sin(x * .02) * 2 + Math.sin(z * .031 + 1) * 1.6 + Math.sin((x + z) * .09) * .5); } bedGeo.computeVertexNormals(); }

  uniforms: bedU, clipping: true, clippingPlanes: [],

  void main(){ vec4 w = modelMatrix*vec4(position,1.); vW=w.xyz; vN=normal; vec4 mvPosition=viewMatrix*w;
  #include <clipping_planes_vertex>

  const gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, "rgba(255,255,255,.55)"); gr.addColorStop(1, "rgba(255,255,255,0)");

// ---------- tekne ----------
function makeBoat(stripe) {

  const white = new THREE.MeshStandardMaterial({ color: 0xf2f4f5, roughness: .45 });
  const cab = new THREE.Mesh(new THREE.BoxGeometry(6.5, 3.4, 5.2), white); cab.position.set(3.5, 3.8, 0); g.add(cab);
  const cab2 = new THREE.Mesh(new THREE.BoxGeometry(4.6, 2.2, 4.4), white); cab2.position.set(4, 6.5, 0); g.add(cab2);
  const win = new THREE.Mesh(new THREE.BoxGeometry(4.7, .9, 4.5), new THREE.MeshStandardMaterial({ color: 0x0d1720, roughness: .1, metalness: .6 })); win.position.set(4.05, 6.8, 0); g.add(win);

  const yard = new THREE.Mesh(new THREE.CylinderGeometry(.1, .1, 4.5, 6), steel); yard.rotation.x = Math.PI / 2; yard.position.set(6.5, 14.5, 0); g.add(yard);
  for (const s of [-1, 1]) { const leg = new THREE.Mesh(new THREE.CylinderGeometry(.2, .25, 6.5, 8), steel); leg.position.set(-10.5, 4.8, s * 2.8); leg.rotation.x = -s * .18; g.add(leg); }
  const bar = new THREE.Mesh(new THREE.CylinderGeometry(.22, .22, 6.6, 8), steel); bar.rotation.x = Math.PI / 2; bar.position.set(-10.5, 8, 0); g.add(bar);
  const drum = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 4.2, 18), new THREE.MeshStandardMaterial({ color: 0x2f6b4f, roughness: .9 })); drum.rotation.x = Math.PI / 2; drum.position.set(-6.5, 3.6, 0); g.add(drum);
  const lamp = (c, x, y, z) => { const m = new THREE.Mesh(new THREE.SphereGeometry(.22, 8, 6), new THREE.MeshBasicMaterial({ color: c })); m.position.set(x, y, z); g.add(m); };
  lamp(0xff3030, 4, 7.9, 2.5); lamp(0x30ff60, 4, 7.9, -2.5); lamp(0xffffff, 6.5, 16.6, 0);
  // iz (wake)

function dimLine(a, b, alpha, col = "#ffffff") {      // ölçü çizgisi iki 3D nokta arası

// ---------- uygula ----------

function apply(st, T) {

  const fogC = new THREE.Color(under ? 0x2c8fb2 : MOOD.fog); scene.fog.color.copy(fogC); scene.fog.density = under ? .0075 : (st.mood === "storm" ? .0011 : .0005);

  else { NET.L = 120; NET.H = 24; }

  netLines.visible = skin.visible = floats.visible = weights.visible = nv > 0; netLineMat.opacity = .7 * nv; for (const r of ropes) r.visible = nv > 0;
  if (nv > 0) { updateNet(); updateRopes(st.D); }
  // balık

  cone.visible = !!st.cone; if (st.cone) { const top = boatA.position.clone().add(V(4, -1, 0)), bot = V(st.fishC.x, st.fishC.y, st.fishC.z); const h = top.y - bot.y;
    cone.scale.set(1, h, 1); cone.position.set(lerp(top.x, bot.x, .5), (top.y + bot.y) / 2, lerp(top.z, bot.z, .5)); cone.lookAt(top); cone.rotateX(Math.PI / 2); cone.material.opacity = .25 * st.cone; }

function ctaAnim(lt, d) {

  const k = (d - .25) / 3.4;                                    // kısa: en fazla ~3 sn

  let x = P.s[0], y = P.s[1];

  const clicks = [[1.0, "logo"], [2.0, "sub"], [2.8, "sh"]]; let ro = 0, rx = 0, ry = 0, rs = 1;
  for (const [ct, p] of clicks) { const e = tt - ct; if (e >= 0 && e < .45) { ro = 1 - e / .45; rs = 1 + e * 9; rx = P[p][0]; ry = P[p][1]; } }
  rip.style.opacity = ro * a; rip.style.left = rx + "px"; rip.style.top = ry + "px"; rip.style.transform = `scale(${rs})`;
  const lb = tt - 1.0; $("ctaLogo").style.transform = `scale(${lb > 0 && lb < .3 ? 1 + .12 * Math.sin(lb / .3 * Math.PI) : 1})`;
  const bs = $("bSub"); if (tt > 2.05) { bs.textContent = "✓ Abone olundu"; bs.classList.add("done"); } else { bs.textContent = "Abone ol"; bs.classList.remove("done"); }
  $("bSh").style.background = tt > 2.85 ? "#e3141b" : "#111";
}
function captions(T) {
  const c = $("cap"); let html = "";
  for (const s of TL.S) { if (T < s.s - .05 || T > s.e + .15) continue;
    // 2–3 kelimelik parçalar
    const W = s.words; const chunks = []; let cur = [];
    for (const w of W) { cur.push(w); if (cur.length >= 3 || /[,.!?;:]$/.test(w.w)) { chunks.push(cur); cur = []; } } if (cur.length) chunks.push(cur);
    for (const ch of chunks) if (T >= ch[0].s - .05 && T < ch[ch.length - 1].e + .12) html = ch.map(w => `<span class="${T >= w.s && T < w.e + .05 ? "on" : ""}">${w.w}</span>`).join(" ");
  }

}
window.seek = (T) => {
  let cur = TL.S[0], i = 0;
