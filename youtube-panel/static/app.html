<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{APP_NAME}}</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%230b1d3a%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%227%22 fill=%22%23ffc81f%22/%3E%3C/svg%3E">
<style>
  /* Kontrol odası: lacivert kumanda masası (kenar çubuğu) + açık çalışma alanı; genel bakış bir monitör duvarı. */
  :root{
    color-scheme:light;
    --paper:#eef0f3; --panel:#ffffff; --sunk:#e5e8ed; --hover:#dfe3ea;
    --ink:#0d1626; --ink-2:#47506a; --muted:#7f88a0; --line:#d8dce4;
    --desk:#0b1d3a; --desk-2:#11264a; --desk-3:#183260; --desk-ink:#e8edf7; --desk-muted:#8798bd; --desk-line:rgba(232,237,247,.09);
    --tally:#ffc81f; --tally-ink:#0b1d3a;
    --chart:#1f4fd1; --chart-soft:rgba(31,79,209,.12);
    --pos:#13854a; --neg:#d6343a; --pos-d:#3ddc84; --neg-d:#ff6b6b; --flat-d:#5f6f92;
    --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
    --sans:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"Chivo Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --paper:#0a0f1a; --panel:#111827; --sunk:#0e1522; --hover:#182234;
      --ink:#e8edf7; --ink-2:#a9b3c8; --muted:#6f7a92; --line:#1e293c;
      --desk:#071226; --desk-2:#0e1f3e; --desk-3:#15305c;
      --chart:#6ea0ff; --chart-soft:rgba(110,160,255,.14);
      --pos:#3ddc84; --neg:#ff6b6b;
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --paper:#0a0f1a; --panel:#111827; --sunk:#0e1522; --hover:#182234;
    --ink:#e8edf7; --ink-2:#a9b3c8; --muted:#6f7a92; --line:#1e293c;
    --desk:#071226; --desk-2:#0e1f3e; --desk-3:#15305c;
    --chart:#6ea0ff; --chart-soft:rgba(110,160,255,.14);
    --pos:#3ddc84; --neg:#ff6b6b;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans);-webkit-font-smoothing:antialiased;
       font-feature-settings:"tnum" 1}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)}
  .hidden{display:none!important}
  :focus-visible{outline:2px solid var(--tally);outline-offset:2px}
  kbd{font:11px/1 var(--mono);color:inherit;opacity:.7}

  /* Kumanda masası (kenar çubuğu) ------------------------------------------ */
  .shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100%}
  .desk{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;background:var(--desk);color:var(--desk-ink);padding:0 10px}
  .brand{display:flex;align-items:center;gap:10px;height:60px;padding:0 8px;font:800 24px/1 var(--display);letter-spacing:.05em;text-transform:uppercase}
  .onair{width:9px;height:9px;border-radius:50%;background:var(--tally);box-shadow:0 0 0 3px rgba(255,200,31,.18)}
  .search{display:flex;align-items:center;gap:8px;width:100%;height:34px;padding:0 10px;border:1px solid var(--desk-line);border-radius:6px;
          background:rgba(255,255,255,.04);color:var(--desk-muted);cursor:pointer;font-size:13px}
  .search span{flex:1;text-align:left}
  .search:hover{border-color:rgba(232,237,247,.22);color:var(--desk-ink)}
  .nav{display:flex;flex-direction:column;gap:1px;margin:12px 0 0}
  .nav a{display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;color:var(--desk-muted);font-weight:500}
  .nav a:hover{background:rgba(255,255,255,.05);color:var(--desk-ink)}
  .nav a.on{background:var(--desk-3);color:var(--desk-ink)}
  .nav a.on svg{color:var(--tally)}
  .sec{display:flex;align-items:center;justify-content:space-between;margin:20px 0 6px;padding:0 6px 0 10px;
       font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--desk-muted)}
  .sec a{display:grid;place-items:center;width:24px;height:24px;border-radius:5px;color:var(--desk-ink);background:rgba(255,255,255,.06)}
  .sec a:hover{background:var(--tally);color:var(--tally-ink)}
  .chs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px;margin:0 -4px;padding:0 4px 8px}
  .ch{display:grid;grid-template-columns:20px 8px minmax(0,1fr) auto;gap:9px;align-items:center;height:34px;padding:0 10px 0 8px;
      border-radius:6px;color:var(--desk-muted);font-size:13.5px}
  .ch:hover{background:rgba(255,255,255,.05);color:var(--desk-ink)}
  .ch.on{background:var(--desk-3);color:var(--desk-ink)}
  .ch.on .no{color:var(--tally)}
  .ch .no{font:500 10.5px var(--mono);color:var(--desk-muted)}
  .ch .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ch .dl{font:11px var(--mono)}
  .tl{width:7px;height:7px;border-radius:50%;background:var(--flat-d)}
  .tl.pos{background:var(--pos-d);box-shadow:0 0 6px rgba(61,220,132,.55)}
  .tl.neg{background:var(--neg-d);box-shadow:0 0 6px rgba(255,107,107,.55)}
  .tl.err{background:var(--tally)}
  .dl.pos{color:var(--pos)} .dl.neg{color:var(--neg)} .dl.flat{color:var(--muted)}
  .desk .dl.pos{color:var(--pos-d)} .desk .dl.neg{color:var(--neg-d)} .desk .dl.flat{color:var(--desk-muted)}
  .me{display:flex;align-items:center;gap:10px;padding:12px 10px;margin:0 -10px;border-top:1px solid var(--desk-line)}
  .me .acct{flex:1;min-width:0;line-height:1.3;font-size:13px}
  .me .acct b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me .acct span{font:11px var(--mono);color:var(--desk-muted)}
  .ib{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:6px;background:none;cursor:pointer;color:inherit;opacity:.8;flex:none}
  .ib:hover{opacity:1;background:var(--hover)}
  .desk .ib:hover{background:rgba(255,255,255,.08)}
  .ib:disabled{opacity:.3;cursor:default}
  .spin svg{animation:spin .8s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}

  /* Üst çubuk ---------------------------------------------------------------- */
  .main{min-width:0;padding-bottom:44px}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:68px;padding:10px 32px;
       background:var(--paper);border-bottom:1px solid var(--line)}
  .crumb{display:flex;align-items:baseline;gap:14px;min-width:0;flex:1}
  .crumb h1{margin:0;font:800 30px/1 var(--display);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb .tc{font:12px var(--mono);color:var(--muted);white-space:nowrap}
  .menu{display:none}
  .pager{display:flex;gap:2px}
  .seg{display:inline-flex;padding:3px;background:var(--sunk);border-radius:7px;flex:none}
  .seg button{border:0;background:none;height:28px;padding:0 11px;border-radius:5px;font-size:13px;font-weight:500;color:var(--ink-2);cursor:pointer}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--ink);color:var(--paper)}
  .content{padding:24px 32px 40px;max-width:1360px}
  .banner{display:flex;gap:10px;align-items:baseline;font-size:13px;color:var(--ink-2);padding:10px 14px;border-radius:6px;background:var(--panel);
          border:1px solid var(--line);margin-bottom:18px}
  .banner .tag{font:600 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;background:var(--tally);color:var(--tally-ink);flex:none}
  .banner.err .tag{background:var(--neg);color:#fff}
  .banner a{color:var(--chart);font-weight:600}
  code{font:12px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:3px;white-space:nowrap}

  /* Ölçü şeridi + grafik ------------------------------------------------------ */
  .board{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:22px;overflow:hidden}
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
  .stat{all:unset;box-sizing:border-box;position:relative;padding:16px 20px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
  .stat:last-child{border-right:0}
  button.stat{cursor:pointer}
  button.stat:hover{background:var(--sunk)}
  button.stat:focus-visible{outline:2px solid var(--tally);outline-offset:-2px}
  .stat.on{background:var(--panel)}
  .stat.on::after{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--tally)}
  .stat .lb{display:flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
  .stat.on .lb{color:var(--ink)}
  .stat .vl{font:800 46px/1 var(--display);letter-spacing:.01em;margin:10px 0 6px;white-space:nowrap}
  .stat .cm{display:flex;gap:8px;align-items:baseline;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden}
  .dl{font:12px var(--mono);white-space:nowrap}
  .chart{position:relative;padding:14px 18px 10px}
  .lg{display:flex;gap:18px;justify-content:flex-end;font:11px var(--mono);color:var(--muted);margin-bottom:2px}
  .lg span{display:inline-flex;align-items:center;gap:6px}
  .sw{display:inline-block;width:16px;border-top:2.5px solid var(--chart)}
  .sw.p{border-top:1.5px dashed var(--muted)}
  .plot{height:240px}
  .plot svg{display:block;overflow:visible}
  .tip{position:absolute;top:34px;pointer-events:none;background:var(--desk);color:var(--desk-ink);border-radius:8px;padding:10px 12px;
       font-size:12.5px;min-width:210px;display:none;z-index:3;box-shadow:0 12px 30px rgba(7,18,38,.3)}
  .tip .d{font:11px var(--mono);color:var(--tally);margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
  .tip .r{display:flex;align-items:center;gap:8px;padding:1.5px 0}
  .tip .r b{margin-left:auto;font-weight:600;padding-left:14px}
  .tip .r .t{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--desk-muted)}
  .tip .r .no{font:10.5px var(--mono);color:var(--desk-muted);width:20px}
  .tip .sw{border-top-color:var(--tally)} .tip .sw.p{border-top-color:var(--desk-muted)}
  .tip hr{border:0;border-top:1px solid var(--desk-line);margin:7px 0}

  /* Bölüm başlıkları --------------------------------------------------------- */
  .bh{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:6px 0 12px}
  .bh h2{margin:0;font:800 22px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
  .bh .sub{font:11.5px var(--mono);color:var(--muted)}
  .bh .r{margin-left:auto;display:flex;gap:8px;align-items:center}
  .sort{height:34px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);font:13px var(--sans);padding:0 8px}

  /* Monitör duvarı -------------------------------------------------------------- */
  .wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:10px;margin-bottom:26px;
        padding:10px;background:var(--desk);border-radius:12px}
  .mon{position:relative;display:flex;flex-direction:column;gap:2px;padding:12px 14px 12px;background:var(--desk-2);color:var(--desk-ink);
       border:1px solid var(--desk-line);border-radius:7px;min-width:0;transition:border-color .15s,transform .15s}
  .mon:hover{border-color:var(--tally);transform:translateY(-2px)}
  .wall.boot .mon{animation:poweron .55s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i) * 45ms)}
  @keyframes poweron{0%{opacity:0;filter:brightness(2.2) saturate(0);transform:scaleY(.04)}45%{opacity:1;transform:scaleY(1)}100%{filter:none}}
  .mon:focus-visible{outline:2px solid var(--tally);outline-offset:2px}
  .mon .hd{display:flex;align-items:center;gap:8px;font:500 11px var(--mono);color:var(--desk-muted)}
  .mon .hd .no{color:var(--tally);letter-spacing:.06em}
  .mon .hd .dl{margin-left:auto}
  .mon .nm{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px;margin-top:10px;min-width:0}
  .mon .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mon .nm .av{background:var(--desk-3);color:var(--desk-ink)}
  .mon .hn{font-size:12px;color:var(--desk-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mon .big{display:flex;align-items:baseline;gap:8px;margin-top:10px}
  .mon .big b{font:800 42px/1 var(--display);letter-spacing:.01em}
  .mon .big span{font:11px var(--mono);color:var(--desk-muted)}
  .mon svg.sp{display:block;width:100%;height:38px;margin:8px 0 6px}
  .mon .ft{display:flex;align-items:center;gap:10px;font:11px var(--mono);color:var(--desk-muted)}
  .meter{display:flex;gap:2px}
  .meter i{width:6px;height:10px;border-radius:1px;background:rgba(232,237,247,.12)}
  .meter i.on{background:var(--tally)}
  .mon .ft .sub{margin-left:auto}
  .mon.alert{border-color:rgba(255,107,107,.55)}
  .mon .flag{font:600 9.5px/1 var(--mono);letter-spacing:.08em;padding:3px 5px 2px;background:var(--neg-d);color:#2a0606;border-radius:3px}
  .mon.err{border-style:dashed}
  .mon.err .msg{font-size:12.5px;color:var(--desk-muted);margin-top:10px}
  .mon.err a{color:var(--tally);font-weight:600}

  /* Liste / tablolar ------------------------------------------------------------ */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:26px;overflow:hidden}
  .tw{overflow-x:auto}
  table{border-collapse:collapse;width:100%}
  th,td{padding:0 14px;height:48px;text-align:right;white-space:nowrap}
  th{height:36px;font:500 10.5px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:var(--sunk)}
  th button{all:unset;cursor:pointer}
  th button:hover,th.on{color:var(--ink)}
  td{border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:0}
  th:first-child,td:first-child{padding-left:18px}
  th:last-child,td:last-child{padding-right:18px}
  .l{text-align:left}
  td.b{font-weight:600}
  .no-c{font:500 11px var(--mono);color:var(--muted);text-align:left;width:44px}
  tr.go{cursor:pointer}
  tr.go:hover td{background:var(--sunk)}
  .who{display:flex;align-items:center;gap:10px;min-width:0}
  .who b{font-weight:600}
  .who .h{font-size:12px;color:var(--muted)}
  .share{display:inline-flex;align-items:center;gap:8px}
  .share .meter i{background:var(--sunk)} .share .meter i.on{background:var(--chart)}
  td.err{color:var(--neg);text-align:left;white-space:normal;font-size:13px}
  td.err a{color:var(--chart);font-weight:600}

  .run{list-style:none;margin:0;padding:0}
  .run li{display:grid;grid-template-columns:44px 128px minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 18px;border-bottom:1px solid var(--line)}
  .run li:last-child{border-bottom:0}
  .run .rk{font:800 28px/1 var(--display);color:var(--muted)}
  .run li:nth-child(-n+3) .rk{color:var(--ink)}
  .th{position:relative;display:block;width:100%;max-width:100%;aspect-ratio:16/9;border-radius:5px;overflow:hidden;background:var(--desk-2)}
  .th img{width:100%;height:100%;object-fit:cover;display:block}
  .th.nosig{background:linear-gradient(90deg,#bfbfbf 0 14.3%,#bfbf3a 0 28.6%,#3abfbf 0 42.9%,#3abf3a 0 57.1%,#bf3abf 0 71.4%,#bf3a3a 0 85.7%,#3a3abf 0) top/100% 68% no-repeat,
    linear-gradient(90deg,#3a3abf 0 14.3%,#14141c 0 28.6%,#bf3abf 0 42.9%,#14141c 0 57.1%,#3abfbf 0 71.4%,#14141c 0 85.7%,#bfbfbf 0) 0 68%/100% 10% no-repeat,
    linear-gradient(90deg,#0b1d3a 0 60%,#2a3550 0) bottom/100% 22% no-repeat;filter:saturate(.55) brightness(.92)}
  .th .du{position:absolute;right:4px;bottom:4px;background:rgba(7,18,38,.85);color:#fff;font:10px/1 var(--mono);padding:3px 4px;border-radius:2px}
  .th .du.s{background:var(--tally);color:var(--tally-ink)}
  .run .tt{font-weight:600;font-size:14.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .run .tt:hover{text-decoration:underline}
  .run .mt{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font:11.5px var(--mono);color:var(--muted)}
  .run .mt a:hover{color:var(--ink)}
  .run .mt .no{color:var(--chart)}
  .run .nums{text-align:right;line-height:1.25}
  .run .nums b{display:block;font:800 26px/1 var(--display)}
  .run .nums span{font:11px var(--mono);color:var(--muted)}
  .vd{display:flex;align-items:center;gap:12px;min-width:300px;white-space:normal;text-align:left;padding:8px 0}
  .vd .th{width:96px;flex:none}
  .vd .tt{font-weight:600;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .vd .tt:hover{text-decoration:underline}
  .vd .mt{font:11.5px var(--mono);color:var(--muted);margin-top:2px}
  .more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;height:42px;font:500 12px var(--mono);
        letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);cursor:pointer}
  .more:hover{background:var(--sunk);color:var(--ink)}
  .av{border-radius:50%;flex:none;background:var(--sunk);color:var(--ink-2);display:grid;place-items:center;font-weight:700;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover}

  /* Kanal başlığı ------------------------------------------------------------ */
  .hero{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:20px 22px;margin-bottom:18px;background:var(--desk);color:var(--desk-ink);border-radius:12px}
  .hero .no{font:800 54px/1 var(--display);color:var(--tally);letter-spacing:.02em}
  .hero .tx{min-width:0;flex:1}
  .hero h2{margin:0;font:800 34px/1.05 var(--display);letter-spacing:.02em;text-transform:uppercase;overflow-wrap:anywhere}
  .hero .mt{font:12px var(--mono);color:var(--desk-muted);margin-top:6px}
  .hero .lk{display:flex;gap:8px}
  .hero .lk a{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:6px;border:1px solid var(--desk-line);font-size:13px;font-weight:500}
  .hero .lk a:hover{border-color:var(--tally);color:var(--tally)}

  .foot{font:11px var(--mono);color:var(--muted);margin-top:-10px}
  .sk{background:var(--sunk);border-radius:6px;animation:pl 1.4s ease-in-out infinite}
  .wall .sk{background:var(--desk-2)}
  @keyframes pl{50%{opacity:.55}}

  /* Alt bant (hareketliler) ------------------------------------------------------ */
  .ticker{position:fixed;left:252px;right:0;bottom:0;z-index:6;display:flex;height:36px;background:var(--tally);color:var(--tally-ink);
          padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
  .ticker .lab{flex:none;display:flex;align-items:center;padding:0 14px;background:var(--desk);color:var(--tally);font:800 15px var(--display);letter-spacing:.08em;text-transform:uppercase}
  .ticker .rail{flex:1;overflow:hidden;display:flex;align-items:center;mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent)}
  .ticker .run-t{display:flex;gap:28px;white-space:nowrap;padding-left:24px;font:500 12.5px var(--mono);animation:crawl 40s linear infinite}
  .ticker:hover .run-t{animation-play-state:paused}
  .ticker .run-t a:hover{text-decoration:underline}
  .ticker .up::before{content:"▲ "} .ticker .dn::before{content:"▼ "}
  @keyframes crawl{to{transform:translateX(-50%)}}
  body.no-ticker .ticker{display:none}

  /* Boş durum, ayarlar ---------------------------------------------------------- */
  .empty{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding:28px;background:var(--desk);color:var(--desk-ink);border-radius:14px}
  .empty h2{font:800 46px/1 var(--display);text-transform:uppercase;letter-spacing:.02em;margin:0 0 12px}
  .empty p{color:var(--desk-muted);margin:0 0 22px;max-width:44ch}
  .empty ol{margin:22px 0 0;padding-left:18px;color:var(--desk-muted);font-size:13.5px}
  .empty li{margin:6px 0}
  .ghost-wall{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .ghost-wall i{aspect-ratio:4/3;border:1px dashed var(--desk-line);border-radius:6px;display:grid;place-items:center;font:500 11px var(--mono);color:var(--desk-muted);font-style:normal}
  .btn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border-radius:7px;border:1px solid var(--line);background:var(--panel);
       font-weight:600;font-size:13.5px;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--ink-2)}
  .btn.pri{background:var(--tally);border-color:var(--tally);color:var(--tally-ink)}
  .btn.pri:hover{filter:brightness(1.05)}
  .btn.neg{color:var(--neg)}
  .btn:disabled{opacity:.4;cursor:default}
  .set{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line)}
  .set:first-of-type{border-top:0}
  .set .tx{flex:1;min-width:0}
  .set .tx b{font-weight:600;display:block}
  .set .tx span{font-size:12.5px;color:var(--muted)}
  .use{display:flex;gap:2px;margin-top:10px}
  .use i{flex:1;max-width:14px;height:12px;border-radius:2px;background:var(--sunk)}
  .use i.on{background:var(--ink)}
  .confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

  /* ⌘K -------------------------------------------------------------------------- */
  .pal{position:fixed;inset:0;z-index:50;background:rgba(7,18,38,.45);display:flex;justify-content:center;align-items:flex-start;padding:14vh 16px 16px}
  .pbox{width:100%;max-width:560px;background:var(--desk);color:var(--desk-ink);border:1px solid var(--desk-line);border-radius:12px;box-shadow:0 30px 70px rgba(0,0,0,.4);overflow:hidden}
  .pin{display:flex;align-items:center;gap:10px;height:52px;padding:0 16px;border-bottom:1px solid var(--desk-line);color:var(--desk-muted)}
  .pin input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:15px;color:var(--desk-ink)}
  .pls{max-height:min(420px,60vh);overflow-y:auto;padding:6px}
  .pit{display:grid;grid-template-columns:24px 8px minmax(0,1fr) auto;gap:10px;align-items:center;height:38px;padding:0 10px;border-radius:6px;cursor:pointer;font-size:14px;color:var(--desk-muted)}
  .pit.on{background:var(--desk-3);color:var(--desk-ink)}
  .pit .no{font:500 10.5px var(--mono)} .pit.on .no{color:var(--tally)}
  .pit .h{font:11.5px var(--mono);color:var(--desk-muted)}
  .pgr{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--desk-muted);padding:10px 10px 4px}
  .pft{display:flex;gap:16px;padding:9px 16px;border-top:1px solid var(--desk-line);font:11px var(--mono);color:var(--desk-muted)}

  .toast{position:fixed;left:50%;bottom:calc(52px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--desk);color:var(--desk-ink);
         border-left:3px solid var(--tally);padding:10px 16px;border-radius:6px;font-size:13px;z-index:60;max-width:calc(100% - 32px);display:none}
  .toast.show{display:block}

  /* Dar ekran ---------------------------------------------------------------------- */
  .scrim{display:none}
  @media (max-width:1150px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} .stat:nth-child(2n){border-right:0} }
  @media (max-width:900px){
    .shell{grid-template-columns:1fr}
    .desk{position:fixed;left:0;top:0;bottom:0;width:280px;z-index:40;transform:translateX(-100%);transition:transform .2s}
    .desk.open{transform:none;box-shadow:0 0 80px rgba(0,0,0,.4)}
    .scrim.open{display:block;position:fixed;inset:0;background:rgba(7,18,38,.4);z-index:30}
    .menu{display:grid}
    .top{padding:10px 14px}
    .content{padding:16px 12px 32px}
    .ticker{left:0}
    .sm{display:none}
    .empty{grid-template-columns:1fr}
    .run li{grid-template-columns:28px 96px minmax(0,1fr)}
    .run .nums{grid-column:3;text-align:left;display:flex;gap:8px;align-items:baseline}
    .run .nums b{display:inline;font-size:22px}
  }
  @media (max-width:560px){
    .crumb{flex-basis:100%;order:-1}
    .crumb h1{font-size:26px}
    .crumb .tc{display:none}
    .stat{padding:12px 14px} .stat .vl{font-size:34px}
    .xs{display:none}
    th,td{padding:0 8px}
    .who .h{display:none}
    .wall{grid-template-columns:1fr 1fr;gap:6px;padding:6px}
    .mon{padding:10px}
    .mon .big b{font-size:32px}
    .mon .hn,.mon .ft .sub{display:none}
    .run li{grid-template-columns:84px minmax(0,1fr);gap:12px}
    .run .rk{display:none}
    .run .nums{grid-column:2}
    .vd{min-width:0} .vd .th{width:72px}
    .hero{padding:16px} .hero .no{font-size:40px} .hero h2{font-size:26px}
    .plot{height:190px}
  }
  @media (prefers-reduced-motion:reduce){ .ticker .run-t{animation:none} .mon,.desk{transition:none} .sk{animation:none} .wall.boot .mon{animation:none} }
</style>
</head>
<body>
<div class="shell">
  <aside class="desk" id="desk">
    <div class="brand"><span class="onair" aria-hidden="true"></span>{{APP_NAME}}</div>
    <button class="search" id="openPal"><i data-i="search"></i><span>Kanal ara</span><kbd id="kbd">⌘K</kbd></button>
    <nav class="nav">
      <a href="#/" data-nav="overview"><i data-i="wall"></i>Monitör duvarı</a>
      <a href="#/ayarlar" data-nav="settings"><i data-i="settings"></i>Ayarlar</a>
    </nav>
    <div class="sec"><span>Kanallar <span id="chCount"></span></span><a href="/giris?toplu=1" title="Kanal ekle" aria-label="Kanal ekle"><i data-i="plus"></i></a></div>
    <div class="chs" id="chList"></div>
    <div class="me" id="me"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="top">
      <button class="ib menu" id="menuBtn" aria-label="Menü"></button>
      <div class="crumb" id="crumb"></div>
      <div class="pager" id="pager"></div>
      <div class="seg" id="days" role="group" aria-label="Dönem">
        <button data-d="7">7 gün</button><button data-d="28">28 gün</button><button data-d="90">90 gün</button>
      </div>
      <button class="ib" id="refresh" title="Verileri yenile" aria-label="Yenile"></button>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>
<div class="ticker hidden" id="ticker" aria-label="Dönemin en hareketli kanalları"><span class="lab">Hareket</span><div class="rail"><div class="run-t" id="tickRun"></div></div></div>

<div class="pal hidden" id="pal">
  <div class="pbox" role="dialog" aria-label="Kanal ara">
    <div class="pin"><i data-i="search"></i><input id="pIn" placeholder="Kanal adı ya da numarası (ör. 07)" autocomplete="off"><kbd>esc</kbd></div>
    <div class="pls" id="pList"></div>
    <div class="pft"><span>↑↓ seç</span><span>↵ aç</span><span>← → kanal sayfasında önceki / sonraki</span></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================================
// Yardımcılar
// ============================================================================
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("tr-TR");
const cf = new Intl.NumberFormat("tr-TR", {notation: "compact", maximumFractionDigits: 1});
const num = v => v == null ? "—" : (Math.abs(v) >= 10000 ? cf.format(v) : nf.format(Math.round(v)));
const full = v => v == null ? "—" : nf.format(Math.round(v));
const signed = v => (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v));
const signedFull = v => (v > 0 ? "+" : v < 0 ? "−" : "") + full(Math.abs(v));
const pct1 = v => nf.format(Math.round(v * 10) / 10);
const dshort = s => new Date(s + "T00:00:00").toLocaleDateString("tr-TR", {day: "numeric", month: "short"});
const dlong = s => new Date(s + "T00:00:00").toLocaleDateString("tr-TR", {weekday: "short", day: "numeric", month: "long"});
const tc = s => { const [y, m, d] = s.split("-"); return `${d}.${m}.${y}`; };
const dur = s => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0");
                   return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
const low = s => String(s).toLocaleLowerCase("tr");
const ytUrl = id => `https://youtu.be/${encodeURIComponent(id)}`;
const chHref = id => `#/kanal/${encodeURIComponent(id)}`;

const I = {
  wall: '<rect x="3" y="4" width="8" height="7" rx="1"/><rect x="13" y="4" width="8" height="7" rx="1"/><rect x="3" y="13" width="8" height="7" rx="1"/><rect x="13" y="13" width="8" height="7" rx="1"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  ext: '<path d="M7 17 17 7"/><path d="M8 7h9v9"/>',
  left: '<path d="m15 18-6-6 6-6"/>',
  right: '<path d="m9 18 6-6-6-6"/>',
  menu: '<line x1="4" x2="20" y1="7" y2="7"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="17" y2="17"/>',
  logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/>',
};
const ic = (name, size = 16) => `<svg class="i" viewBox="0 0 24 24" style="width:${size}px;height:${size}px" aria-hidden="true">${I[name]}</svg>`;

function avatar(o, size = 24){
  return `<span class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size * .42)}px">${o && o.thumb
    ? `<img src="${esc(o.thumb)}" alt="" referrerpolicy="no-referrer" loading="lazy">`
    : esc(((o && (o.title || o.name)) || "?").trim()[0] || "?")}</span>`;
}
const state = p => p == null ? "flat" : p >= 2 ? "pos" : p <= -2 ? "neg" : "flat";
function delta(p){
  if (p == null) return `<span class="dl flat">yeni</span>`;
  const r = Math.round(p * 10) / 10, s = state(p);
  return `<span class="dl ${s}">${r > 0 ? "▲" : r < 0 ? "▼" : "■"} %${pct1(Math.abs(r))}</span>`;
}
const change = (cur, prev) => prev ? (cur - prev) / Math.abs(prev) * 100 : null;
function meter(frac, n = 10){
  const lit = Math.max(frac > 0 ? 1 : 0, Math.round(frac * n));
  return `<span class="meter" aria-hidden="true">${Array.from({length: n}, (_, i) => `<i class="${i < lit ? "on" : ""}"></i>`).join("")}</span>`;
}

const store = {
  get(k, d){ try { return localStorage.getItem("kp-" + k) ?? d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem("kp-" + k, v); } catch {} },
};
let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 6000); }

// ============================================================================
// Durum ve veri
// ============================================================================
const S = {
  me: null,
  days: [7, 28, 90].includes(+store.get("days", 28)) ? +store.get("days", 28) : 28,
  ov: {}, top: {},
  sort: {k: store.get("sort", "views"), dir: -1},
  view: store.get("view", "wall") === "list" ? "list" : "wall",
  metric: ["views", "hours", "subs"].includes(store.get("metric")) ? store.get("metric") : "views",
  redraw: null, seq: 0,
};

async function api(path, {fresh = false, method = "GET", days = true} = {}){
  let url = path;
  if (days) url += (path.includes("?") ? "&" : "?") + "days=" + S.days + (fresh ? "&fresh=1" : "");
  const r = await fetch(url, {method, headers: {"Accept": "application/json"}});
  if (r.status === 401){ location.reload(); throw new Error("Oturum kapandı"); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || `Hata ${r.status}`);
  return data;
}
function overview(fresh){
  if (fresh || !S.ov[S.days]) S.ov[S.days] = api("/api/overview", {fresh}).catch(e => { delete S.ov[S.days]; throw e; });
  return S.ov[S.days];
}
function topVideos(fresh){
  if (fresh || !S.top[S.days]) S.top[S.days] = api("/api/top-videos", {fresh}).catch(e => { delete S.top[S.days]; throw e; });
  return S.top[S.days];
}
const channelsSorted = () => [...S.me.channels].sort((a, b) => a.title.localeCompare(b.title, "tr"));
// Kanal numarası: alfabetik sıradaki yeri. Kenar çubuğu, duvar ve aramada aynı numara.
function chNo(id){ const i = channelsSorted().findIndex(c => c.id === id); return String(i + 1).padStart(2, "0"); }

const METRICS = {
  views: {label: "İzlenme", get: p => p.views, fmt: full},
  hours: {label: "İzlenme süresi", get: p => p.minutes / 60, fmt: v => full(v) + " sa"},
  subs:  {label: "Net abone", get: p => p.subs, fmt: signedFull},
};

// ============================================================================
// Kumanda masası
// ============================================================================
const planName = p => ({beta: "Beta", free: "Ücretsiz", pro: "Pro", agency: "Ağ"}[p] || p);
function renderMe(){
  const u = S.me.user;
  $("#me").innerHTML = `${avatar({thumb: u.picture, title: u.name || u.email}, 30)}
    <div class="acct"><b>${esc(u.name || u.email || "Hesabım")}</b><span>${esc(planName(u.plan))} · ${S.me.channels.length}/${S.me.limit} kanal</span></div>
    <form method="post" action="/cikis"><button class="ib" title="Çıkış yap" aria-label="Çıkış yap">${ic("logout")}</button></form>`;
}
let ovById = {};
function renderDesk(){
  const r = currentRoute();
  $("#chCount").textContent = S.me.channels.length ? `· ${S.me.channels.length}` : "";
  $("#chList").innerHTML = channelsSorted().map((c, i) => {
    const o = ovById[c.id];
    const st = !o ? "" : o.error ? "err" : state(o.views_change);
    const dl = o && !o.error && o.views_change != null
      ? `<span class="dl ${st}">${o.views_change > 0 ? "+" : o.views_change < 0 ? "−" : ""}${Math.abs(Math.round(o.views_change))}%</span>` : "<span></span>";
    return `<a class="ch ${r.view === "channel" && r.id === c.id ? "on" : ""}" href="${chHref(c.id)}" title="${esc(c.title)}">
      <span class="no">${String(i + 1).padStart(2, "0")}</span><span class="tl ${st}"></span><span class="nm">${esc(c.title)}</span>${dl}</a>`;
  }).join("") || `<a class="ch" href="/giris?toplu=1"><span class="no">--</span><span class="tl"></span><span class="nm">İlk kanalını ekle</span><span></span></a>`;
  document.querySelectorAll(".nav a").forEach(a => a.classList.toggle("on", a.dataset.nav === r.view));
}
function openDesk(){ $("#desk").classList.add("open"); $("#scrim").classList.add("open"); }
function closeDesk(){ $("#desk").classList.remove("open"); $("#scrim").classList.remove("open"); }

function renderTicker(ov){
  const ok = ov ? ov.channels.filter(c => !c.error && c.views_change != null) : [];
  if (!ok.length){ $("#ticker").classList.add("hidden"); return; }
  const movers = [...ok].sort((a, b) => Math.abs(b.views_change) - Math.abs(a.views_change)).slice(0, 10);
  const items = movers.map(c => `<a href="${chHref(c.id)}" class="${c.views_change >= 0 ? "up" : "dn"}">CH ${chNo(c.id)} ${esc(c.title)} %${pct1(Math.abs(c.views_change))}</a>`).join("");
  $("#tickRun").innerHTML = items + items;   // kesintisiz akış için iki kez
  $("#ticker").classList.remove("hidden");
}

// ============================================================================
// Grafik
// ============================================================================
function spark(vals, {w = 200, h = 38, stroke = "#8fb4ff", fill = "rgba(143,180,255,.14)"} = {}){
  if (!vals.length) return "";
  const max = Math.max(...vals), min = Math.min(0, ...vals), rng = max - min || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1 || 1) * w, h - 2 - (v - min) / rng * (h - 6)]);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${p[0].toFixed(1)},${p[1].toFixed(1)}`).join("");
  const last = pts[pts.length - 1];
  return `<svg class="sp" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <path d="${line}L${w},${h}L0,${h}Z" fill="${fill}"/>
    <path d="${line}" fill="none" stroke="${stroke}" stroke-width="1.6" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2.6" fill="${stroke}" vector-effect="non-scaling-stroke"/></svg>`;
}

function niceTicks(lo, hi, n = 4){
  if (hi <= lo) hi = lo + 1;
  const raw = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p, out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(Math.round(v / step) * step);
  return out;
}

function drawChart(el, {dates, cur, prev, metric, extra}){
  const plot = $(".plot", el), tip = $(".tip", el), M = METRICS[metric];
  const W = plot.clientWidth, H = plot.clientHeight, L = 46, R = 6, T = 8, B = 24;
  const t = niceTicks(Math.min(0, ...cur, ...prev), Math.max(...cur, ...prev, 1));
  const lo = t[0], hi = t[t.length - 1], n = cur.length;
  const x = i => L + (n > 1 ? i / (n - 1) : .5) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const path = arr => arr.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const k = W < 520 ? 3 : 7;
  const xl = [...new Set(Array.from({length: k}, (_, j) => Math.round(j * (n - 1) / (k - 1))))];
  const base = y(Math.max(lo, 0)), last = n - 1;
  plot.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Günlük ${esc(M.label)}">
    <defs><linearGradient id="g${el.id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--chart)" stop-opacity=".22"/><stop offset="1" stop-color="var(--chart)" stop-opacity="0"/></linearGradient></defs>
    ${t.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v === 0 ? "" : 'stroke-dasharray="2 4"'}/>
      <text x="${L - 10}" y="${y(v) + 3.5}" text-anchor="end" font-size="10.5" font-family="var(--mono)" fill="var(--muted)">${num(v)}</text>`).join("")}
    ${xl.map(i => `<text x="${x(i)}" y="${H - 5}" text-anchor="${i === 0 ? "start" : i === last ? "end" : "middle"}" font-size="10.5" font-family="var(--mono)" fill="var(--muted)">${dshort(dates[i]).toLocaleUpperCase("tr")}</text>`).join("")}
    <path d="${path(cur)}L${x(last)},${base}L${x(0)},${base}Z" fill="url(#g${el.id})"/>
    <path d="${path(prev)}" fill="none" stroke="var(--muted)" stroke-width="1.25" stroke-dasharray="3 3"/>
    <path d="${path(cur)}" fill="none" stroke="var(--chart)" stroke-width="2.25" stroke-linejoin="round"/>
    <circle cx="${x(last)}" cy="${y(cur[last])}" r="4" fill="var(--chart)" stroke="var(--panel)" stroke-width="2"/>
    <line class="xh" y1="${T}" y2="${H - B}" stroke="var(--tally)" stroke-width="1.5" visibility="hidden"/>
    <circle class="dt" r="5" fill="var(--tally)" stroke="var(--panel)" stroke-width="2" visibility="hidden"/>
    <rect x="${L - 6}" y="0" width="${W - L - R + 12}" height="${H}" fill="transparent"/></svg>`;
  const svg = $("svg", plot), xh = $(".xh", svg), dt = $(".dt", svg);
  const show = cx => {
    const rc = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(last, Math.round((cx - rc.left - L) / (W - L - R) * last)));
    const px = x(i);
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    dt.setAttribute("cx", px); dt.setAttribute("cy", y(cur[i])); dt.setAttribute("visibility", "visible");
    tip.innerHTML = `<div class="d">${dlong(dates[i])}</div>
      <div class="r"><i class="sw"></i>Bu dönem<b>${M.fmt(cur[i])}</b></div>
      <div class="r"><i class="sw p"></i>Önceki dönem<b>${M.fmt(prev[i])}</b></div>${extra ? extra(i) : ""}`;
    tip.style.display = "block";
    const tw = tip.offsetWidth, off = 18 + 16;
    tip.style.left = (px + off + tw > W + 18 ? px + 18 - tw - 16 : px + off) + "px";
  };
  svg.addEventListener("pointermove", e => show(e.clientX));
  svg.addEventListener("pointerdown", e => show(e.clientX));
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); dt.setAttribute("visibility", "hidden"); });
}

// Ölçü şeridi: ilk üç hücre grafiğin kanalını seçer.
function board(id, cells){
  return `<section class="board" id="${id}">
    <div class="stats">${cells.map(c => c.metric
      ? `<button class="stat ${S.metric === c.metric ? "on" : ""}" data-m="${c.metric}" aria-pressed="${S.metric === c.metric}">
           <div class="lb">${c.label}</div><div class="vl">${c.value}</div><div class="cm">${c.delta}<span>${c.sub}</span></div></button>`
      : `<div class="stat"><div class="lb">${c.label}</div><div class="vl">${c.value}</div><div class="cm"><span>${c.sub}</span></div></div>`).join("")}</div>
    <div class="chart"><div class="lg"><span><i class="sw"></i>SON ${S.days} GÜN</span><span><i class="sw p"></i>ÖNCEKİ ${S.days} GÜN</span></div>
      <div class="plot"></div><div class="tip"></div></div></section>`;
}
function bindBoard(el, draw){
  el.querySelectorAll("button.stat").forEach(b => b.onclick = () => {
    S.metric = b.dataset.m; store.set("metric", S.metric);
    el.querySelectorAll("button.stat").forEach(x => { x.classList.toggle("on", x === b); x.setAttribute("aria-pressed", x === b); });
    draw();
  });
}

function clip(root, n = 10){
  root.querySelectorAll("[data-clip]").forEach(list => {
    const items = [...list.children];
    if (items.length <= n) return;
    items.slice(n).forEach(x => x.classList.add("hidden"));
    const b = document.createElement("button");
    b.className = "more"; b.textContent = `Tümünü göster · ${items.length}`;
    b.onclick = () => { items.forEach(x => x.classList.remove("hidden")); b.remove(); };
    list.closest(".card").appendChild(b);
  });
}
function thumb(v){
  const s = v.seconds && v.seconds <= 180;
  return `<a class="th ${v.thumb ? "" : "nosig"}" href="${ytUrl(v.id)}" target="_blank" rel="noopener" aria-label="YouTube'da aç">
    ${v.thumb ? `<img src="${esc(v.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
    <span class="du ${s ? "s" : ""}">${s ? "KISA" : dur(v.seconds)}</span></a>`;
}
function skeleton(){
  return `<section class="board"><div class="stats">${`<div class="stat"><div class="sk" style="height:11px;width:40%"></div><div class="sk" style="height:40px;width:62%;margin:12px 0 8px"></div><div class="sk" style="height:11px;width:70%"></div></div>`.repeat(4)}</div>
    <div class="chart"><div class="sk" style="height:240px"></div></div></section>
    <div class="wall">${`<div class="sk" style="height:200px"></div>`.repeat(4)}</div>`;
}

const SORTS = {
  views: {label: "İzlenme", get: c => c.views},
  views_change: {label: "Değişim", get: c => c.views_change ?? -1e9},
  subscribers: {label: "Abone", get: c => c.subscribers ?? -1},
  subs: {label: "Net abone", get: c => c.subs},
  hours: {label: "İzlenme süresi", get: c => c.hours},
  no: {label: "Kanal numarası", get: c => -parseInt(chNo(c.id), 10)},
};
function sortChannels(list){
  const s = SORTS[S.sort.k] || SORTS.views;
  return [...list].sort((a, b) => { const x = s.get(a), y = s.get(b); return (x > y ? 1 : x < y ? -1 : 0) * S.sort.dir; });
}

async function renderOverview(fresh, seq){
  setTop({title: "Monitör duvarı"});
  if (!S.me.channels.length){ $("#view").innerHTML = emptyState(); renderTicker(null); return; }
  if (!S.ov[S.days] || fresh) $("#view").innerHTML = skeleton();
  const ov = await overview(fresh);
  if (seq !== S.seq) return;
  setTop({title: "Monitör duvarı", range: ov});
  ovById = {}; ov.channels.forEach(c => ovById[c.id] = c); renderDesk(); renderTicker(ov);

  const ok = ov.channels.filter(c => !c.error), bad = ov.channels.filter(c => c.error);
  const sum = k => ok.reduce((a, c) => a + (c[k] || 0), 0);
  const n = ok.length ? ok[0].series.length : 0, dates = ok.length ? ok[0].series.map(p => p.d) : [];
  const total = (key, m) => Array.from({length: n}, (_, i) => ok.reduce((a, c) => a + METRICS[m].get(c[key][i]), 0));
  const subs = ok.some(c => c.subscribers != null) ? sum("subscribers") : null;
  const alerts = ok.filter(c => c.views_change != null && c.views_change <= -10).length;

  let html = "";
  if (S.me.demo) html += `<div class="banner"><span class="tag">Örnek</span><span>Uydurma kanallar gösteriliyor. Gerçek kanallar için sunucuyu <code>--demo</code> olmadan başlat.</span></div>`;
  if (bad.length) html += errBanner(`${bad.length} kanalın verisi alınamadı:`, bad.map(c => c.title).join(", ") + ".", bad.some(c => c.reauth));
  html += board("ovChart", [
    {metric: "views", label: "İzlenme", value: num(sum("views")), delta: delta(change(sum("views"), sum("prev_views"))), sub: `önceki ${num(sum("prev_views"))}`},
    {metric: "hours", label: "İzlenme süresi", value: num(sum("hours")) + " sa", delta: delta(change(sum("hours"), sum("prev_hours"))), sub: `önceki ${num(sum("prev_hours"))}`},
    {metric: "subs", label: "Net abone", value: signed(sum("subs")), delta: delta(change(sum("subs"), sum("prev_subs"))), sub: `önceki ${signed(sum("prev_subs"))}`},
    {label: "Toplam abone", value: num(subs), sub: `${ok.length} kanal${alerts ? ` · <b style="color:var(--neg)">${alerts} dikkat</b>` : ""}`},
  ]);
  html += `<div class="bh"><h2>Kanallar</h2><span class="sub">${ov.channels.length} MONİTÖR · SON ${S.days} GÜN</span>
    <div class="r"><label class="sub" for="sortSel">SIRALA</label>
      <select class="sort" id="sortSel">${Object.entries(SORTS).map(([k, s]) => `<option value="${k}">${s.label}</option>`).join("")}</select>
      <div class="seg" role="group" aria-label="Görünüm"><button data-v="wall">Duvar</button><button data-v="list">Liste</button></div></div></div>
    <div id="chArea"></div>`;
  html += `<div class="bh"><h2>Yayın akışı</h2><span class="sub">TÜM KANALLARDA EN ÇOK İZLENENLER · SON ${S.days} GÜN</span></div>
    <section class="card" id="topVideos"><div style="padding:16px"><div class="sk" style="height:180px"></div></div></section>`;
  html += `<p class="foot">YOUTUBE ANALYTICS VERİSİ ~48 SAAT GECİKMELİ · DÖNEM ${tc(ov.end)} TARİHİNDE BİTER · ABONE SAYILARI ANLIK</p>`;
  $("#view").innerHTML = html;

  const el = $("#ovChart");
  const draw = () => drawChart(el, {dates, metric: S.metric, cur: total("series", S.metric), prev: total("prev_series", S.metric),
    extra: i => {
      const m = METRICS[S.metric], rows = ok.map(c => ({c, v: m.get(c.series[i])})).sort((a, b) => b.v - a.v);
      return `<hr>${rows.slice(0, 5).map(r => `<div class="r"><span class="no">${chNo(r.c.id)}</span><span class="t">${esc(r.c.title)}</span><b>${m.fmt(r.v)}</b></div>`).join("")}
        ${rows.length > 5 ? `<div class="r" style="color:var(--desk-muted)">+${rows.length - 5} kanal</div>` : ""}`;
    }});
  bindBoard(el, draw); draw(); S.redraw = draw;

  const sel = $("#sortSel"); sel.value = SORTS[S.sort.k] ? S.sort.k : "views";
  sel.onchange = () => { S.sort = {k: sel.value, dir: -1}; store.set("sort", sel.value); renderArea(ov.channels); };
  document.querySelectorAll(".bh .seg button").forEach(b => b.onclick = () => { S.view = b.dataset.v; store.set("view", S.view); renderArea(ov.channels); });
  renderArea(ov.channels, !S.booted); S.booted = true;

  topVideos(fresh).then(d => { if (seq === S.seq){ $("#topVideos").innerHTML = rundown(d.videos); clip($("#topVideos").parentElement); } })
    .catch(e => { if (seq === S.seq) $("#topVideos").innerHTML = `<p class="muted" style="padding:16px">Videolar alınamadı: ${esc(e.message)}</p>`; });
}

    <thead><tr><th class="no-c">CH</th><th class="l">Kanal</th><th class="xs">Abone</th><th>İzlenme</th><th class="sm">Pay</th><th>Değişim</th><th class="sm">Gidişat</th><th class="sm">İzlenme süresi</th><th class="xs">Net abone</th></tr></thead>

      <td class="xs">${num(c.subscribers)}</td><td class="b">${num(c.views)}</td>

}

function neighbors(id){
  const list = channelsSorted(), i = list.findIndex(c => c.id === id);

}

    <section class="card"><div class="set"><div class="tx"><b>Hesabı ve tüm kanal bağlantılarını kalıcı olarak sil</b>
      <span>Kanallarına dokunulmaz; bu paneldeki bağlantılar ve Google izinleri kaldırılır.</span></div>
      <span class="confirm" data-id="__account">${S.me.demo ? `<button class="btn neg" disabled>Hesabı sil</button>` : `<button class="btn neg" data-act="ask">Hesabı sil</button>`}</span></div></section>`;
  // Onay sayfanın içinde: "Kaldır" -> "Emin misin? Evet / Vazgeç"
  $("#view").querySelectorAll(".confirm").forEach(box => box.addEventListener("click", async e => {
    const act = e.target.dataset.act; if (!act) return;
    const id = box.dataset.id, acc = id === "__account";
    if (act === "ask"){ box.innerHTML = `<span class="muted" style="font-size:13px">Emin misin?</span><button class="btn neg" data-act="yes">${acc ? "Evet, sil" : "Evet, kaldır"}</button><button class="btn" data-act="no">Vazgeç</button>`; return; }
    if (act === "no"){ box.innerHTML = `<button class="btn neg" data-act="ask">${acc ? "Hesabı sil" : "Kaldır"}</button>`; return; }
    try {
      if (acc){ await api("/api/account", {method: "DELETE", days: false}); location.href = "/"; return; }
      await api(`/api/channel/${encodeURIComponent(id)}`, {method: "DELETE", days: false});
      await refreshMe(); toast("Kanal kaldırıldı."); renderSettings();
    } catch (err) { toast(err.message); }
  }));
}

async function refreshMe(){
  S.me = await api("/api/me", {days: false});
  S.ov = {}; S.top = {}; ovById = {};
  renderMe(); renderDesk();
}

// ============================================================================
// Üst çubuk ve yönlendirme
// ============================================================================
function setTop({title, range}){
  $("#crumb").innerHTML = `<h1>${esc(title)}</h1>${range ? `<span class="tc">${tc(range.start)} — ${tc(range.end)}</span>` : ""}`;
  document.title = `${title} · {{APP_NAME}}`;
}
function currentRoute(){
  const h = location.hash, m = h.match(/^#\/kanal\/(.+)$/);
  if (m) return {view: "channel", id: decodeURIComponent(m[1])};
  if (h === "#/ayarlar") return {view: "settings"};
  return {view: "overview"};
}
async function route(fresh = false){
  const seq = ++S.seq, r = currentRoute();
  S.redraw = null; closeDesk(); closePal();
  document.querySelectorAll("#days button").forEach(b => b.classList.toggle("on", +b.dataset.d === S.days));
  $("#days").classList.toggle("hidden", r.view === "settings");
  document.body.classList.toggle("no-ticker", r.view === "settings");
  const [prev, next] = r.view === "channel" ? neighbors(r.id) : [null, null];
  $("#pager").innerHTML = prev && S.me.channels.length > 1
    ? `<a class="ib" href="${chHref(prev.id)}" title="Önceki: CH ${chNo(prev.id)} ${esc(prev.title)} (←)">${ic("left")}</a><a class="ib" href="${chHref(next.id)}" title="Sonraki: CH ${chNo(next.id)} ${esc(next.title)} (→)">${ic("right")}</a>` : "";
  renderDesk();
  window.scrollTo(0, 0);
  try {
    if (r.view === "channel") await renderChannel(r.id, fresh, seq);
    else if (r.view === "settings") renderSettings();
    else await renderOverview(fresh, seq);
  } catch (e) { if (seq === S.seq) $("#view").innerHTML = errBanner("Veri alınamadı.", e.message); }
}
function loadDesk(){
  if (!S.me.channels.length) return;
  overview().then(ov => { ovById = {}; ov.channels.forEach(c => ovById[c.id] = c); renderDesk(); renderTicker(ov); }).catch(() => {});
}

// ============================================================================
// ⌘K
// ============================================================================
const P = {items: [], idx: 0};
function palItems(q){
  q = low(q.trim());
  const chans = channelsSorted().map(c => ({label: c.title, sub: c.handle, href: chHref(c.id), no: chNo(c.id), id: c.id, group: "Kanallar"}));
  const pages = [{label: "Monitör duvarı", href: "#/", icon: "wall", group: "Sayfalar"},
                 {label: "Ayarlar", href: "#/ayarlar", icon: "settings", group: "Sayfalar"},
                 {label: "Kanal ekle", href: "/giris?toplu=1", icon: "plus", group: "Sayfalar"}];
  return [...chans, ...pages].filter(it => !q || low(it.label).includes(q) || low(it.sub || "").includes(q) || (it.no && (it.no === q.padStart(2, "0") || it.no.startsWith(q))));
}
function renderPal(){
  let g = "";
  $("#pList").innerHTML = P.items.map((it, i) => {
    const o = it.id && ovById[it.id], st = o ? (o.error ? "err" : state(o.views_change)) : "";
    return `${it.group !== g ? `<div class="pgr">${(g = it.group)}</div>` : ""}
    <div class="pit ${i === P.idx ? "on" : ""}" data-i="${i}">${it.no ? `<span class="no">${it.no}</span><span class="tl ${st}"></span>` : `<span>${ic(it.icon, 15)}</span><span></span>`}
    <span>${esc(it.label)}</span><span class="h">${esc(it.sub || "")}</span></div>`;
  }).join("") || `<div style="padding:14px;color:var(--desk-muted)">Sonuç yok</div>`;
  const on = $("#pList .pit.on"); if (on) on.scrollIntoView({block: "nearest"});
}
function openPal(){ $("#pal").classList.remove("hidden"); const i = $("#pIn"); i.value = ""; P.items = palItems(""); P.idx = 0; renderPal(); i.focus(); }
function closePal(){ $("#pal").classList.add("hidden"); }
function go(it){ closePal(); if (it.href.startsWith("#")) location.hash = it.href; else location.href = it.href; }
$("#pIn").addEventListener("input", e => { P.items = palItems(e.target.value); P.idx = 0; renderPal(); });
$("#pIn").addEventListener("keydown", e => {
  if (e.key === "ArrowDown"){ P.idx = Math.min(P.items.length - 1, P.idx + 1); renderPal(); e.preventDefault(); }
  else if (e.key === "ArrowUp"){ P.idx = Math.max(0, P.idx - 1); renderPal(); e.preventDefault(); }
  else if (e.key === "Enter" && P.items[P.idx]) go(P.items[P.idx]);
  else if (e.key === "Escape") closePal();
});
$("#pList").addEventListener("click", e => { const it = e.target.closest(".pit"); if (it) go(P.items[+it.dataset.i]); });
$("#pal").addEventListener("click", e => { if (e.target.id === "pal") closePal(); });
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#pal").classList.contains("hidden") ? openPal() : closePal(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/"){ e.preventDefault(); openPal(); return; }
  const r = currentRoute();
  if (r.view === "channel" && (e.key === "ArrowLeft" || e.key === "ArrowRight")){
    const [prev, next] = neighbors(r.id), t = e.key === "ArrowLeft" ? prev : next;
    if (t) location.hash = chHref(t.id);
  }
});

// ============================================================================
// Başlat
// ============================================================================
document.querySelectorAll("i[data-i]").forEach(el => el.outerHTML = ic(el.dataset.i));
$("#menuBtn").innerHTML = ic("menu", 18);
$("#refresh").innerHTML = ic("refresh");
if (!/Mac|iPhone|iPad/.test(navigator.platform)) $("#kbd").textContent = "Ctrl K";
$("#openPal").onclick = openPal;
$("#menuBtn").onclick = openDesk;
$("#scrim").onclick = closeDesk;
document.querySelectorAll("#days button").forEach(b => b.onclick = () => { S.days = +b.dataset.d; store.set("days", S.days); route(); loadDesk(); });
$("#refresh").onclick = async () => {
  const b = $("#refresh"); b.disabled = true; b.classList.add("spin");
  S.ov = {}; S.top = {};
  await route(true); loadDesk();
  b.disabled = false; b.classList.remove("spin");
};
window.addEventListener("hashchange", () => route());
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => S.redraw && S.redraw(), 120); });

(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get("hata")){ toast(q.get("hata")); history.replaceState(null, "", "/" + location.hash); }
  try { S.me = await api("/api/me", {days: false}); }
  catch (e) { $("#view").innerHTML = errBanner("Sunucuya ulaşılamadı.", e.message); return; }
  renderMe();
  route();
  loadDesk();
})();
</script>
</body>
</html>
