<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{APP_NAME}}</title>
<link rel="stylesheet" href="/static/fonts/fonts.css">
<style>
  :root{
    color-scheme:light;
    --bg:#fafaf9; --panel:#fff; --sunk:#f4f4f2; --hover:#f0f0ed; --sel:#e9e9e5;
    --ink:#161616; --ink-2:#4a4a47; --muted:#8a8984;
    --line:#e7e6e2; --line-2:#d5d4cf; --grid:#efeeea;
    --accent:#1f5fbf;
    --pos:#1a7f37; --neg:#c4302b;
    --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root{
      color-scheme:dark;
      --bg:#111110; --panel:#171716; --sunk:#1c1c1b; --hover:#212120; --sel:#292927;
      --ink:#ededea; --ink-2:#b4b3ad; --muted:#7c7b76;
      --line:#272725; --line-2:#363633; --grid:#222220;
      --accent:#5b9bf0;
      --pos:#3fb950; --neg:#f0605a;
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);
       -webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit}
  svg.i{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;
        stroke-linecap:round;stroke-linejoin:round}
  .mono{font-family:var(--mono)}
  .muted{color:var(--muted)}
  .hidden{display:none!important}
  kbd{font:11px/1 var(--mono);color:var(--muted)}
  :focus-visible{outline:2px solid var(--accent);outline-offset:1px}

  /* İskelet ---------------------------------------------------------------- */
  .shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}
  .side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--line);padding:0 8px}
  .brand{display:flex;align-items:center;gap:8px;height:52px;padding:0 8px;font-weight:600;letter-spacing:-.01em;font-size:15px}
  .mark{width:18px;height:18px;border-radius:4px;background:var(--ink);display:grid;place-items:center}
  .search{display:flex;align-items:center;gap:8px;width:100%;height:30px;padding:0 8px;border:1px solid var(--line);
          border-radius:5px;background:var(--panel);color:var(--muted);cursor:pointer;font-size:13px}
  .search span{flex:1;text-align:left}
  .search:hover{border-color:var(--line-2)}
  .nav{display:flex;flex-direction:column;margin:10px 0 0}
  .row{display:flex;align-items:center;gap:9px;height:30px;padding:0 8px;border-radius:5px;color:var(--ink-2);min-width:0;font-size:13.5px}
  .row:hover{background:var(--hover);color:var(--ink)}
  .row.on{background:var(--sel);color:var(--ink);font-weight:500}
  .sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 4px;padding:0 4px 0 8px;font-size:12px;color:var(--muted)}
  .sec a{display:grid;place-items:center;width:22px;height:22px;border-radius:4px;color:var(--ink-2)}
  .sec a:hover{background:var(--hover);color:var(--ink)}
  .chs{flex:1;overflow-y:auto;display:flex;flex-direction:column}
  .row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .dl{font-size:11.5px}
  .bang{font:600 11px var(--mono);color:var(--neg)}
  .me{display:flex;align-items:center;gap:9px;padding:10px 12px 10px 16px;border-top:1px solid var(--line);margin:0 -8px}
  .me .acct{flex:1;min-width:0;line-height:1.3;font-size:13px}
  .me .acct b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me .acct span{font-size:12px;color:var(--muted)}
  .ib{display:grid;place-items:center;width:28px;height:28px;border:0;border-radius:5px;background:none;cursor:pointer;color:var(--ink-2);flex:none}
  .ib:hover{background:var(--hover);color:var(--ink)}
  .ib:disabled{opacity:.35;cursor:default}
  .spin svg{animation:spin .8s linear infinite} @keyframes spin{to{transform:rotate(360deg)}}

  .main{min-width:0}
  .top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:52px;padding:0 32px;
       background:var(--bg);border-bottom:1px solid var(--line)}
  .crumb{display:flex;align-items:center;gap:10px;min-width:0}
  .crumb h1{font-size:15px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crumb .rng{font:12px var(--mono);color:var(--muted);white-space:nowrap}
  .spacer{flex:1}
  .menu{display:none}
  .pager{display:flex}
  .seg{display:inline-flex;border:1px solid var(--line-2);border-radius:5px;overflow:hidden;flex:none}
  .seg button{border:0;background:var(--panel);height:28px;padding:0 10px;font-size:12.5px;color:var(--ink-2);cursor:pointer}
  .seg button+button{border-left:1px solid var(--line-2)}
  .seg button:hover{color:var(--ink)}
  .seg button.on{background:var(--ink);color:var(--bg)}
  .content{padding:28px 32px 72px;max-width:1280px}
  .banner{font-size:13px;color:var(--ink-2);padding:9px 12px;border:1px solid var(--line);border-left:3px solid var(--ink-2);
          border-radius:4px;background:var(--panel);margin-bottom:20px}
  .banner.err{border-left-color:var(--neg)}
  .banner a{color:var(--accent);font-weight:500}
  code{font:12px var(--mono);background:var(--sunk);padding:1px 4px;border-radius:3px;white-space:nowrap}

  /* Panel ------------------------------------------------------------------ */
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;margin-bottom:24px}
  .ph{display:flex;align-items:baseline;gap:10px;padding:14px 16px 10px}
  .ph h2{font-size:14px;font-weight:600;margin:0}
  .ph .sub{font-size:12px;color:var(--muted)}
  .ph .r{margin-left:auto}

  /* Ölçü şeridi + grafik (şerit aynı zamanda grafiğin sekmesi) ----------- */
  .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid var(--line)}
  .stat{all:unset;box-sizing:border-box;padding:14px 18px;border-right:1px solid var(--line);position:relative;min-width:0}
  .stat:last-child{border-right:0}
  button.stat{cursor:pointer}
  button.stat:hover{background:var(--sunk)}
  button.stat:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
  .stat.on::before{content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;background:var(--accent)}
  .stat:first-child.on::before{border-top-left-radius:6px}
  .stat .lb{font-size:12.5px;color:var(--ink-2)}
  .stat.on .lb{color:var(--ink);font-weight:500}
  .stat .vl{font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.2;margin:4px 0 3px;white-space:nowrap}
  .stat .cm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dl{font-family:var(--mono);font-size:12px;white-space:nowrap}
  .dl.pos{color:var(--pos)} .dl.neg{color:var(--neg)} .dl.flat{color:var(--muted)}
  .chart{position:relative;padding:12px 16px 10px}
  .chart .lg{display:flex;gap:16px;justify-content:flex-end;font:11.5px var(--mono);color:var(--muted);margin-bottom:4px}
  .chart .lg span{display:inline-flex;align-items:center;gap:6px}
  .sw{display:inline-block;width:14px;border-top:2px solid var(--accent)}
  .sw.p{border-top:1.5px dashed var(--muted)}
  .plot{height:248px}
  .plot svg{display:block;overflow:visible}
  .tip{position:absolute;top:30px;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:5px;
       padding:9px 11px;font-size:12px;min-width:200px;display:none;z-index:3}
  .tip .d{font:11.5px var(--mono);opacity:.7;margin-bottom:5px}
  .tip .r{display:flex;align-items:center;gap:8px;padding:1.5px 0}
  .tip .r b{margin-left:auto;font-weight:500;padding-left:14px}
  .tip .r .t{max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
  .tip .sw{border-top-color:var(--bg)} .tip .sw.p{border-top-color:color-mix(in srgb,var(--bg) 55%,transparent)}
  .tip hr{border:0;border-top:1px solid color-mix(in srgb,var(--bg) 18%,transparent);margin:6px 0}

  /* Tablolar ---------------------------------------------------------------- */
  .tw{overflow-x:auto}
  table{border-collapse:collapse;width:100%}
  th,td{padding:0 14px;height:44px;text-align:right;white-space:nowrap}
  th{height:34px;font-size:12px;font-weight:400;color:var(--muted);border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--sunk)}
  th button{all:unset;cursor:pointer}
  th button:hover,th.on{color:var(--ink)}
  td{border-bottom:1px solid var(--line)}
  tbody tr:last-child td{border-bottom:0}
  th:first-child,td:first-child{padding-left:16px}
  th:last-child,td:last-child{padding-right:16px}
  .l{text-align:left}
  .n{font-variant-numeric:tabular-nums}
  td.b{font-weight:500}
  .rk{width:28px;padding-right:0;color:var(--muted);font:12px var(--mono);text-align:left}
  tr.go{cursor:pointer}
  tr.go:hover td{background:var(--sunk)}
  .who{display:flex;align-items:center;gap:10px;min-width:0}
  .who b{font-weight:500}
  .who .h{font-size:12px;color:var(--muted);margin-left:2px}
  .share{display:inline-flex;align-items:center;gap:8px}
  .share i{display:block;width:64px;height:6px;background:var(--sunk);border-radius:1px;overflow:hidden}
  .share i u{display:block;height:100%;background:var(--accent);opacity:.8}
  .share span{width:42px;text-align:right}
  td.err{color:var(--neg);text-align:left;white-space:normal;font-size:13px}
  td.err a{color:var(--accent)}
  .vd{display:flex;align-items:center;gap:12px;min-width:300px;white-space:normal;text-align:left;padding:8px 0}
  .vd .tt{font-weight:500;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
  .vd .tt:hover{text-decoration:underline}
  .vd .mt{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:1px}
  .vd .mt a:hover{color:var(--ink)}
  .th{position:relative;width:80px;aspect-ratio:16/9;border-radius:3px;overflow:hidden;background:var(--sunk);flex:none}
  .th img{width:100%;height:100%;object-fit:cover;display:block}
  .th .du{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.8);color:#fff;font:10px/1 var(--mono);padding:2px 3px;border-radius:2px}
  .more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;height:38px;font-size:13px;
        color:var(--ink-2);cursor:pointer;border-radius:0 0 6px 6px}
  .more:hover{background:var(--sunk);color:var(--ink)}

  .av{border-radius:50%;flex:none;background:var(--sel);color:var(--ink-2);display:grid;place-items:center;font-weight:600;overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover}

  /* Kanal başlığı --------------------------------------------------------- */
  .head{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .head h2{font-size:20px;font-weight:600;letter-spacing:-.015em;margin:0}
  .head .mt{font-size:13px;color:var(--muted);margin-top:1px}
  .head .lk{margin-left:auto;display:flex;gap:16px;font-size:13px}
  .head .lk a{color:var(--ink-2);display:inline-flex;align-items:center;gap:4px}
  .head .lk a:hover{color:var(--ink);text-decoration:underline}

  .foot{color:var(--muted);font-size:12px;margin-top:-8px}
  .sk{background:var(--sunk);border-radius:4px;animation:pl 1.4s ease-in-out infinite}
  @keyframes pl{50%{opacity:.5}}

  /* Boş durum, ayarlar ---------------------------------------------------- */
  .empty{max-width:480px;padding:40px 0}
  .empty h2{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0 0 8px}
  .empty p{color:var(--ink-2);margin:0 0 20px}
  .empty ol{color:var(--ink-2);font-size:13.5px;padding-left:18px;margin:24px 0 0}
  .empty li{margin:6px 0}
  .btn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:5px;border:1px solid var(--line-2);
       background:var(--panel);font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap}
  .btn:hover{border-color:var(--ink-2)}
  .btn.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .btn.pri:hover{opacity:.88}
  .btn.neg{color:var(--neg)}
  .btn:disabled{opacity:.4;cursor:default}
  .set{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
  .set .tx{flex:1;min-width:0;font-size:13.5px}
  .set .tx b{font-weight:500;display:block}
  .set .tx span{font-size:12px;color:var(--muted)}
  .use{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin-top:8px;max-width:320px}
  .use i{display:block;height:100%;background:var(--ink)}

  /* ⌘K --------------------------------------------------------------------- */
  .pal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.28);display:flex;justify-content:center;align-items:flex-start;padding:14vh 16px 16px}
  .pbox{width:100%;max-width:540px;background:var(--panel);border:1px solid var(--line-2);border-radius:8px;
        box-shadow:0 24px 60px rgba(0,0,0,.22);overflow:hidden}
  .pin{display:flex;align-items:center;gap:10px;height:48px;padding:0 14px;border-bottom:1px solid var(--line);color:var(--muted)}
  .pin input{flex:1;border:0;outline:0;background:none;font:inherit;font-size:14.5px;color:var(--ink)}
  .pls{max-height:min(400px,60vh);overflow-y:auto;padding:6px}
  .pit{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:5px;cursor:pointer;font-size:13.5px}
  .pit.on{background:var(--sel)}
  .pit .h{margin-left:auto;font:12px var(--mono);color:var(--muted)}
  .pgr{font-size:11.5px;color:var(--muted);padding:8px 10px 4px}
  .pft{display:flex;gap:16px;padding:8px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);
         padding:9px 14px;border-radius:5px;font-size:13px;z-index:60;max-width:calc(100% - 32px);display:none}
  .toast.show{display:block}

  /* Mobil ------------------------------------------------------------------ */
  .scrim{display:none}
  @media (max-width:1100px){ .stats{grid-template-columns:repeat(2,minmax(0,1fr))} .stat:nth-child(2){border-right:0}
    .stat:nth-child(-n+2){border-bottom:1px solid var(--line)} }
  @media (max-width:900px){
    .shell{grid-template-columns:1fr}
    .side{position:fixed;left:0;top:0;bottom:0;width:272px;z-index:40;background:var(--bg);transform:translateX(-100%);transition:transform .18s}
    .side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.25)}
    .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:30}
    .menu{display:grid}
    .top{padding:0 12px;gap:8px}
    .crumb .rng{display:none}
    .content{padding:16px 12px 48px}
    .sm{display:none}
  }
  @media (max-width:560px){
    .top{height:auto;flex-wrap:wrap;padding:8px 12px}
    .top .seg{order:9;width:100%} .top .seg button{flex:1}
    .stat{padding:12px} .stat .vl{font-size:21px}
    .xs{display:none}
    th,td{padding:0 8px}
    .who .h{display:none}
    .vd{min-width:0;gap:10px} .th{width:64px}
    .vd .tt{-webkit-line-clamp:2}
    .vd .mt{white-space:nowrap;overflow:hidden}
    .vd .mt a{overflow:hidden;text-overflow:ellipsis}
    .head{flex-wrap:wrap} .head .lk{margin-left:0;width:100%}
    .plot{height:190px}
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side" id="side">
    <div class="brand"><span class="mark" id="mark"></span>{{APP_NAME}}</div>
    <button class="search" id="openPal"><i data-i="search"></i><span>Kanal ara</span><kbd id="kbd">⌘K</kbd></button>
    <nav class="nav">
      <a class="row" href="#/" data-nav="overview"><i data-i="grid"></i>Genel bakış</a>
      <a class="row" href="#/ayarlar" data-nav="settings"><i data-i="settings"></i>Ayarlar</a>
    </nav>
    <div class="sec"><span>Kanallar <span class="mono" id="chCount"></span></span><a href="/giris?toplu=1" title="Kanal ekle" aria-label="Kanal ekle"><i data-i="plus"></i></a></div>
    <div class="chs" id="chList"></div>
    <div class="me" id="me"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main class="main">
    <div class="top">
      <button class="ib menu" id="menuBtn" aria-label="Menü"></button>
      <div class="crumb" id="crumb"></div>
      <span class="spacer"></span>
      <div class="pager" id="pager"></div>
      <div class="seg" id="days" role="group" aria-label="Dönem">
        <button data-d="7">7 gün</button><button data-d="28">28 gün</button><button data-d="90">90 gün</button>
      </div>
      <button class="ib" id="refresh" title="Verileri yenile" aria-label="Yenile"></button>
    </div>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="pal hidden" id="pal">
  <div class="pbox" role="dialog" aria-label="Kanal ara">
    <div class="pin"><i data-i="search"></i><input id="pIn" placeholder="Kanal ara veya sayfaya git" autocomplete="off"><kbd>esc</kbd></div>
    <div class="pls" id="pList"></div>
    <div class="pft"><span><kbd>↑↓</kbd> seç</span><span><kbd>↵</kbd> aç</span><span><kbd>←→</kbd> kanal sayfasında önceki / sonraki</span></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ============================================================================
// Yardımcılar
// ============================================================================
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("tr-TR");
const cf = new Intl.NumberFormat("tr-TR", {notation: "compact", maximumFractionDigits: 1});
const num = v => v == null ? "—" : (Math.abs(v) >= 10000 ? cf.format(v) : nf.format(Math.round(v)));
const full = v => v == null ? "—" : nf.format(Math.round(v));
const signed = v => (v > 0 ? "+" : v < 0 ? "−" : "") + num(Math.abs(v));
const signedFull = v => (v > 0 ? "+" : v < 0 ? "−" : "") + full(Math.abs(v));
const pct1 = v => nf.format(Math.round(v * 10) / 10);
const dshort = s => new Date(s + "T00:00:00").toLocaleDateString("tr-TR", {day: "numeric", month: "short"});
const dlong = s => new Date(s + "T00:00:00").toLocaleDateString("tr-TR", {weekday: "short", day: "numeric", month: "long"});
const dur = s => { s = Math.round(s || 0); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, "0");
                   return h ? `${h}:${String(m).padStart(2, "0")}:${x}` : `${m}:${x}`; };
const low = s => String(s).toLocaleLowerCase("tr");
const ytUrl = id => `https://youtu.be/${encodeURIComponent(id)}`;
const chHref = id => `#/kanal/${encodeURIComponent(id)}`;

const I = {
  grid: '<rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/>',
  settings: '<line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  refresh: '<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  ext: '<path d="M7 17 17 7"/><path d="M8 7h9v9"/>',
  left: '<path d="m15 18-6-6 6-6"/>',
  right: '<path d="m9 18 6-6-6-6"/>',

function spark(vals, w = 88, h = 22){
  if (!vals.length) return "";
  const max = Math.max(...vals), min = Math.min(0, ...vals), rng = max - min || 1;
  const pts = vals.map((v, i) => `${(i / (vals.length - 1 || 1) * (w - 2) + 1).toFixed(1)},${(h - 2 - (v - min) / rng * (h - 4)).toFixed(1)}`);
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="display:block;margin-left:auto">
    <polyline points="${pts.join(" ")}" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round"/></svg>`;
}

function niceTicks(lo, hi, n = 4){
  if (hi <= lo) hi = lo + 1;
  const raw = (hi - lo) / n, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p, out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(Math.round(v / step) * step);
  return out;
}

function drawChart(el, {dates, cur, prev, metric, extra}){
  const plot = $(".plot", el), tip = $(".tip", el), M = METRICS[metric];
  const W = plot.clientWidth, H = plot.clientHeight, L = 44, R = 4, T = 8, B = 24;
  const t = niceTicks(Math.min(0, ...cur, ...prev), Math.max(...cur, ...prev, 1));
  const lo = t[0], hi = t[t.length - 1], n = cur.length;
  const x = i => L + (n > 1 ? i / (n - 1) : .5) * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const path = arr => arr.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const k = W < 520 ? 3 : 7;
  const xl = [...new Set(Array.from({length: k}, (_, j) => Math.round(j * (n - 1) / (k - 1))))];
  const base = y(Math.max(lo, 0));
  plot.innerHTML = `<svg width="${W}" height="${H}" role="img" aria-label="Günlük ${esc(M.label)}">
    <defs><linearGradient id="g${el.id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".12"/><stop offset="1" stop-color="var(--accent)" stop-opacity="0"/></linearGradient></defs>
    ${t.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? "var(--line-2)" : "var(--grid)"}"/>
      <text x="${L - 8}" y="${y(v) + 3.5}" text-anchor="end" font-size="10.5" font-family="var(--mono)" fill="var(--muted)">${num(v)}</text>`).join("")}
    ${xl.map(i => `<text x="${x(i)}" y="${H - 5}" text-anchor="${i === 0 ? "start" : i === n - 1 ? "end" : "middle"}" font-size="10.5" font-family="var(--mono)" fill="var(--muted)">${dshort(dates[i])}</text>`).join("")}
    <path d="${path(cur)}L${x(n - 1)},${base}L${x(0)},${base}Z" fill="url(#g${el.id})"/>
    <path d="${path(prev)}" fill="none" stroke="var(--muted)" stroke-width="1.25" stroke-dasharray="3 3"/>
    <path d="${path(cur)}" fill="none" stroke="var(--accent)" stroke-width="1.75" stroke-linejoin="round"/>
    <line class="xh" y1="${T}" y2="${H - B}" stroke="var(--line-2)" visibility="hidden"/>
    <circle class="dt" r="3.5" fill="var(--panel)" stroke="var(--accent)" stroke-width="2" visibility="hidden"/>
    <rect x="${L - 6}" y="0" width="${W - L - R + 12}" height="${H}" fill="transparent"/></svg>`;
  const svg = $("svg", plot), xh = $(".xh", svg), dt = $(".dt", svg);
  const show = cx => {
    const rc = svg.getBoundingClientRect();
    const i = Math.max(0, Math.min(n - 1, Math.round((cx - rc.left - L) / (W - L - R) * (n - 1))));
    const px = x(i);
    xh.setAttribute("x1", px); xh.setAttribute("x2", px); xh.setAttribute("visibility", "visible");
    dt.setAttribute("cx", px); dt.setAttribute("cy", y(cur[i])); dt.setAttribute("visibility", "visible");
    tip.innerHTML = `<div class="d">${dlong(dates[i])}</div>
      <div class="r"><i class="sw"></i>Bu dönem<b>${M.fmt(cur[i])}</b></div>
      <div class="r"><i class="sw p"></i>Önceki dönem<b>${M.fmt(prev[i])}</b></div>${extra ? extra(i) : ""}`;
    tip.style.display = "block";
    const tw = tip.offsetWidth, off = 16 + 14;
    tip.style.left = (px + off + tw > W + 16 ? px + 16 - tw - 14 : px + off) + "px";
  };
  svg.addEventListener("pointermove", e => show(e.clientX));
  svg.addEventListener("pointerdown", e => show(e.clientX));
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; xh.setAttribute("visibility", "hidden"); dt.setAttribute("visibility", "hidden"); });
}

function clip(root, n = 10){
  root.querySelectorAll("[data-clip]").forEach(list => {
    const items = [...list.children];
    if (items.length <= n) return;
    items.slice(n).forEach(x => x.classList.add("hidden"));
    const b = document.createElement("button");
    b.className = "more"; b.textContent = `Tümünü göster · ${items.length}`;
    b.onclick = () => { items.forEach(x => x.classList.remove("hidden")); b.remove(); };
    list.closest(".panel").appendChild(b);
  });
}

async function renderOverview(fresh, seq){
  setTop({title: "Genel bakış"});

  if (!S.ov[S.days] || fresh) $("#view").innerHTML = skeleton();
  const ov = await overview(fresh);
  if (seq !== S.seq) return;
  setTop({title: "Genel bakış", range: ov});

  const ok = ov.channels.filter(c => !c.error), bad = ov.channels.filter(c => c.error);
  const sum = k => ok.reduce((a, c) => a + (c[k] || 0), 0);
  const n = ok.length ? ok[0].series.length : 0, dates = ok.length ? ok[0].series.map(p => p.d) : [];
  const total = (key, m) => Array.from({length: n}, (_, i) => ok.reduce((a, c) => a + METRICS[m].get(c[key][i]), 0));
  const subs = ok.some(c => c.subscribers != null) ? sum("subscribers") : null;

  let html = "";
  if (S.me.demo) html += `<div class="banner">Örnek veri gösteriliyor. Gerçek kanallar için sunucuyu <code>--demo</code> olmadan başlat.</div>`;
  if (bad.length) html += errBanner(`${bad.length} kanalın verisi alınamadı:`, bad.map(c => c.title).join(", ") + ".", bad.some(c => c.reauth));
  html += statsPanel("ovChart", [
    {metric: "views", label: "İzlenme", value: num(sum("views")), delta: delta(change(sum("views"), sum("prev_views"))), sub: `önceki ${num(sum("prev_views"))}`},
    {metric: "hours", label: "İzlenme süresi", value: num(sum("hours")) + " sa", delta: delta(change(sum("hours"), sum("prev_hours"))), sub: `önceki ${num(sum("prev_hours"))} sa`},
    {metric: "subs", label: "Net abone", value: signed(sum("subs")), delta: delta(change(sum("subs"), sum("prev_subs"))), sub: `önceki ${signed(sum("prev_subs"))}`},
    {label: "Toplam abone", value: num(subs), sub: `${ok.length} kanal · anlık`},
  ]);
  html += `<section class="panel"><div class="ph"><h2>Kanallar</h2><span class="sub">son ${S.days} gün · satıra tıklayınca kanal açılır</span></div>

    <div class="tw" id="topVideos"><div style="padding:0 16px 16px"><div class="sk" style="height:180px"></div></div></div></section>`;
  html += `<p class="foot">YouTube istatistikleri yaklaşık iki gün gecikmeyle gelir; dönem ${dshort(ov.end)} tarihinde biter. Abone sayıları anlıktır.</p>`;
  $("#view").innerHTML = html;

  const el = $("#ovChart");
  const draw = () => drawChart(el, {dates, metric: S.metric, cur: total("series", S.metric), prev: total("prev_series", S.metric),
    extra: i => {
      const m = METRICS[S.metric], rows = ok.map(c => ({c, v: m.get(c.series[i])})).sort((a, b) => b.v - a.v);
      return `<hr>${rows.slice(0, 5).map(r => `<div class="r"><span class="t">${esc(r.c.title)}</span><b>${m.fmt(r.v)}</b></div>`).join("")}
        ${rows.length > 5 ? `<div class="r" style="opacity:.6">+${rows.length - 5} kanal</div>` : ""}`;
    }});

  if (seq !== S.seq) return;
  setTop({title: ch.title || meta.title, channel: {...meta, thumb: ch.thumb || meta.thumb}, range: ch});
  if (ch.error){ $("#view").innerHTML = errBanner(`${meta.title} verisi alınamadı.`, ch.error, ch.reauth); return; }

  const dates = ch.series.map(p => p.d);
  $("#view").innerHTML = `
    <div class="head">${avatar(ch, 44)}<div><h2>${esc(ch.title)}</h2>
      <div class="mt">${esc(ch.handle)} · ${full(ch.video_count)} video · toplam ${num(ch.total_views)} izlenme</div></div>
      <div class="lk"><a href="https://www.youtube.com/channel/${encodeURIComponent(ch.id)}" target="_blank" rel="noopener">YouTube ${ic("ext", 13)}</a>
        <a href="https://studio.youtube.com/channel/${encodeURIComponent(ch.id)}" target="_blank" rel="noopener">Studio ${ic("ext", 13)}</a></div></div>
    ${statsPanel("chChart", [
      {metric: "views", label: "İzlenme", value: num(ch.views), delta: delta(ch.views_change), sub: `önceki ${num(ch.prev_views)}`},
      {metric: "hours", label: "İzlenme süresi", value: num(ch.hours) + " sa", delta: delta(ch.hours_change), sub: `önceki ${num(ch.prev_hours)} sa`},
      {metric: "subs", label: "Net abone", value: signed(ch.subs), delta: delta(change(ch.subs, ch.prev_subs)), sub: `önceki ${signed(ch.prev_subs)}`},
      {label: "Abone", value: num(ch.subscribers), sub: "anlık"},
    ])}
    <section class="panel"><div class="ph"><h2>Bu dönem en çok izlenenler</h2><span class="sub">son ${S.days} gün</span></div>
      <div class="tw">${videoTable(ch.top, false)}</div></section>
    <section class="panel"><div class="ph"><h2>Son yüklenenler</h2><span class="sub">tüm zamanlar</span></div>
      <div class="tw"><table><thead><tr><th class="rk"></th><th class="l">Video</th><th>İzlenme</th><th>Beğeni</th><th class="sm">Yorum</th><th class="xs">Beğeni oranı</th></tr></thead>
      <tbody data-clip>${ch.recent.map((v, i) => `<tr><td class="rk">${i + 1}</td>
        <td class="l"><div class="vd">${thumb(v)}<div style="min-width:0"><a class="tt" href="${ytUrl(v.id)}" target="_blank" rel="noopener">${esc(v.title)}</a>
          <div class="mt"><span class="mono">${dshort(v.published)}</span></div></div></div></td>
        <td class="n b">${num(v.views)}</td><td class="n">${num(v.likes)}</td><td class="n sm">${num(v.comments)}</td>
        <td class="n xs">${v.views ? "%" + pct1(v.likes / v.views * 100) : "—"}</td></tr>`).join("")
        || `<tr><td></td><td class="l muted" colspan="5">Video yok.</td></tr>`}</tbody></table></div></section>
    <p class="foot">YouTube istatistikleri yaklaşık iki gün gecikmeyle gelir; dönem ${dshort(ch.end)} tarihinde biter.</p>`;
  const el = $("#chChart");
  const draw = () => drawChart(el, {dates, metric: S.metric,
    cur: ch.series.map(METRICS[S.metric].get), prev: ch.prev_series.map(METRICS[S.metric].get)});
  bindStats(el, draw); draw(); S.redraw = draw;
  clip($("#view"));
}

function neighbors(id){
  const list = channelsSorted(), i = list.findIndex(c => c.id === id);
  return i < 0 ? [null, null] : [list[(i - 1 + list.length) % list.length], list[(i + 1) % list.length]];
}

// ============================================================================
// Ayarlar
// ============================================================================
function renderSettings(){
  setTop({title: "Ayarlar"});
  const u = S.me.user, used = S.me.channels.length, lim = S.me.limit;
  $("#view").innerHTML = `
    <section class="panel"><div class="ph"><h2>Hesap</h2></div>
      <div class="set">${avatar({thumb: u.picture, title: u.name || u.email}, 36)}
        <div class="tx"><b>${esc(u.name || "—")}</b><span>${esc(u.email || "")}</span></div>
        <form method="post" action="/cikis"><button class="btn">Çıkış yap</button></form></div></section>
    <section class="panel"><div class="ph"><h2>Paket</h2></div>
      <div class="set"><div class="tx"><b>${esc(planName(u.plan))}</b><span class="mono">${used} / ${lim} kanal</span>
        <div class="use"><i style="width:${Math.min(100, used / (lim || 1) * 100)}%"></i></div></div></div></section>
    <section class="panel"><div class="ph"><h2>Bağlı kanallar</h2><a class="btn r" href="/giris?toplu=1">Kanal ekle</a></div>
      ${channelsSorted().map(c => `<div class="set">${avatar(c, 28)}<div class="tx"><b>${esc(c.title)}</b><span>${esc(c.handle)}</span></div>
        ${S.me.demo ? "" : `<button class="btn neg" data-rm="${esc(c.id)}" data-t="${esc(c.title)}">Kaldır</button>`}</div>`).join("")
        || `<div class="set"><div class="tx muted">Henüz kanal yok.</div></div>`}</section>
    <section class="panel"><div class="ph"><h2>Hesabı sil</h2></div>
      <div class="set"><div class="tx"><b>Hesabı ve tüm kanal bağlantılarını kalıcı olarak sil</b>
        <span>Kanallarına dokunulmaz; bu paneldeki bağlantılar ve Google izinleri kaldırılır.</span></div>
        <button class="btn neg" id="delAcc" ${S.me.demo ? "disabled" : ""}>Hesabı sil</button></div></section>`;
  $("#view").querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if (!confirm(`${b.dataset.t} panelden kaldırılsın mı? Kanalın kendisine dokunulmaz.`)) return;
    try { await api(`/api/channel/${encodeURIComponent(b.dataset.rm)}`, {method: "DELETE", days: false}); }
    catch (e) { toast(e.message); return; }
    await refreshMe(); toast("Kanal kaldırıldı."); renderSettings();
  });
  const del = $("#delAcc");
  if (del) del.onclick = async () => {
    if (!confirm("Hesabın ve tüm kanal bağlantıların kalıcı olarak silinecek. Emin misin?")) return;
    try { await api("/api/account", {method: "DELETE", days: false}); location.href = "/"; } catch (e) { toast(e.message); }
  };
}

async function refreshMe(){
  S.me = await api("/api/me", {days: false});
  S.ov = {}; S.top = {}; ovById = {};
  renderMe(); renderSidebar();
}

// ============================================================================
// Üst çubuk ve yönlendirme
// ============================================================================
function setTop({title, channel, range}){
  $("#crumb").innerHTML = `${channel ? avatar(channel, 22) : ""}<h1>${esc(title)}</h1>
    ${range ? `<span class="rng">${dshort(range.start)} – ${dshort(range.end)}</span>` : ""}`;
  document.title = `${title} · {{APP_NAME}}`;
}
function currentRoute(){
  const h = location.hash, m = h.match(/^#\/kanal\/(.+)$/);
  if (m) return {view: "channel", id: decodeURIComponent(m[1])};
  if (h === "#/ayarlar") return {view: "settings"};
  return {view: "overview"};
}
async function route(fresh = false){
  const seq = ++S.seq, r = currentRoute();
  S.redraw = null; closeSide(); closePal();
  document.querySelectorAll("#days button").forEach(b => b.classList.toggle("on", +b.dataset.d === S.days));
  $("#days").classList.toggle("hidden", r.view === "settings");
  const [prev, next] = r.view === "channel" ? neighbors(r.id) : [null, null];
  $("#pager").innerHTML = prev && S.me.channels.length > 1
    ? `<a class="ib" href="${chHref(prev.id)}" title="Önceki: ${esc(prev.title)} (←)">${ic("left")}</a><a class="ib" href="${chHref(next.id)}" title="Sonraki: ${esc(next.title)} (→)">${ic("right")}</a>` : "";
  renderSidebar();
  window.scrollTo(0, 0);
  try {
    if (r.view === "channel") await renderChannel(r.id, fresh, seq);
    else if (r.view === "settings") renderSettings();
    else await renderOverview(fresh, seq);
  } catch (e) { if (seq === S.seq) $("#view").innerHTML = errBanner("Veri alınamadı.", e.message); }
}
function loadSidebarDeltas(){
  if (!S.me.channels.length) return;
  overview().then(ov => { ovById = {}; ov.channels.forEach(c => ovById[c.id] = c); renderSidebar(); }).catch(() => {});
}

// ============================================================================
// ⌘K
// ============================================================================
const P = {items: [], idx: 0};
function palItems(q){
  q = low(q.trim());
  const chans = channelsSorted().map(c => ({label: c.title, sub: c.handle, href: chHref(c.id), ch: c, group: "Kanallar"}));
  const pages = [{label: "Genel bakış", href: "#/", icon: "grid", group: "Sayfalar"},
                 {label: "Ayarlar", href: "#/ayarlar", icon: "settings", group: "Sayfalar"},
                 {label: "Kanal ekle", href: "/giris?toplu=1", icon: "plus", group: "Sayfalar"}];
  return [...chans, ...pages].filter(it => !q || low(it.label).includes(q) || low(it.sub || "").includes(q));
}
function renderPal(){
  let g = "";
  $("#pList").innerHTML = P.items.map((it, i) => `${it.group !== g ? `<div class="pgr">${(g = it.group)}</div>` : ""}
    <div class="pit ${i === P.idx ? "on" : ""}" data-i="${i}">${it.ch ? avatar(it.ch, 20) : `<span style="width:20px;display:grid;place-items:center;color:var(--muted)">${ic(it.icon, 14)}</span>`}
    <span>${esc(it.label)}</span>${it.sub ? `<span class="h">${esc(it.sub)}</span>` : ""}</div>`).join("")
    || `<div class="muted" style="padding:12px">Sonuç yok</div>`;
  const on = $("#pList .pit.on"); if (on) on.scrollIntoView({block: "nearest"});
}
function openPal(){ $("#pal").classList.remove("hidden"); const i = $("#pIn"); i.value = ""; P.items = palItems(""); P.idx = 0; renderPal(); i.focus(); }
function closePal(){ $("#pal").classList.add("hidden"); }
function go(it){ closePal(); if (it.href.startsWith("#")) location.hash = it.href; else location.href = it.href; }
$("#pIn").addEventListener("input", e => { P.items = palItems(e.target.value); P.idx = 0; renderPal(); });
$("#pIn").addEventListener("keydown", e => {
  if (e.key === "ArrowDown"){ P.idx = Math.min(P.items.length - 1, P.idx + 1); renderPal(); e.preventDefault(); }
  else if (e.key === "ArrowUp"){ P.idx = Math.max(0, P.idx - 1); renderPal(); e.preventDefault(); }
  else if (e.key === "Enter" && P.items[P.idx]) go(P.items[P.idx]);
  else if (e.key === "Escape") closePal();
});
$("#pList").addEventListener("click", e => { const it = e.target.closest(".pit"); if (it) go(P.items[+it.dataset.i]); });
$("#pal").addEventListener("click", e => { if (e.target.id === "pal") closePal(); });
document.addEventListener("keydown", e => {
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k"){ e.preventDefault(); $("#pal").classList.contains("hidden") ? openPal() : closePal(); return; }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "/"){ e.preventDefault(); openPal(); return; }
  const r = currentRoute();
  if (r.view === "channel" && (e.key === "ArrowLeft" || e.key === "ArrowRight")){
    const [prev, next] = neighbors(r.id), t = e.key === "ArrowLeft" ? prev : next;
    if (t) location.hash = chHref(t.id);
  }
});

// ============================================================================
// Başlat
// ============================================================================
document.querySelectorAll("i[data-i]").forEach(el => el.outerHTML = ic(el.dataset.i));
$("#mark").innerHTML = `<svg viewBox="0 0 18 18" width="12" height="12" aria-hidden="true"><rect x="2" y="9" width="3" height="7" fill="var(--bg)"/><rect x="7.5" y="4" width="3" height="12" fill="var(--bg)"/><rect x="13" y="7" width="3" height="9" fill="var(--bg)"/></svg>`;
$("#menuBtn").innerHTML = ic("menu", 17);
$("#refresh").innerHTML = ic("refresh");
if (!/Mac|iPhone|iPad/.test(navigator.platform)) $("#kbd").textContent = "Ctrl K";
$("#openPal").onclick = openPal;
$("#menuBtn").onclick = openSide;
$("#scrim").onclick = closeSide;
document.querySelectorAll("#days button").forEach(b => b.onclick = () => { S.days = +b.dataset.d; store.set("days", S.days); route(); loadSidebarDeltas(); });
$("#refresh").onclick = async () => {
  const b = $("#refresh"); b.disabled = true; b.classList.add("spin");
  S.ov = {}; S.top = {};
  await route(true); loadSidebarDeltas();
  b.disabled = false; b.classList.remove("spin");
};
window.addEventListener("hashchange", () => route());
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => S.redraw && S.redraw(), 120); });

(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get("hata")){ toast(q.get("hata")); history.replaceState(null, "", "/" + location.hash); }
  try { S.me = await api("/api/me", {days: false}); }
  catch (e) { $("#view").innerHTML = errBanner("Sunucuya ulaşılamadı.", e.message); return; }
  renderMe();
  route();
  loadSidebarDeltas();
})();
</script>
</body>
</html>
